<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found (404) | Pacific Panel</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#031525" />
    <style>
      :root { --bg: #031525; --panel: #08263f; --line: #16436a; --acc: #ff8a70; --acc-dim: #b3604d; --text: #e8f3f1; --dim: #8fb3c4; --red: #ff8a70;
        --font: 'Consolas', 'Menlo', ui-monospace, monospace; --ui: 'Segoe UI', system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); line-height: 1.6; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 14px 14px 80px; }
      .brand { font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--acc); letter-spacing: .5px; padding: 4px 2px 12px; }
      .brand .flag { color: var(--red); }
      .brand small { color: var(--dim); font-weight: 400; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px; }
      h1 { font-family: var(--font); font-size: 20px; color: var(--acc); margin: 0 0 8px; line-height: 1.35; }
      p { margin: 0 0 16px; color: var(--dim); }
      .btn { display: inline-block; padding: 8px 14px; border: 1px solid var(--acc-dim); border-radius: 8px; color: var(--acc); text-decoration: none; font-family: var(--font); font-size: 14px; }
      .btn:hover, .btn:focus-visible { background: var(--acc); color: var(--bg); outline: none; }
      footer { margin-top: 26px; color: var(--dim); font-size: 12px; text-align: center; }
      footer a { color: var(--acc-dim); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">▎PACIFIC PANEL <small>· cyclone · ocean · money · work</small></div>
      <main class="card">
        <h1>404 — page not found</h1>
        <p>There is no page at this address. Pacific Panel is a single page — everything is on the home screen.</p>
        <a class="btn" href="/">← Back to Pacific Panel</a>
      </main>
      <footer>© 2026 broodev · Y-Systems · <a href="https://broodev.com/">broodev.com</a> · <a href="https://dev.broodev.com/">About the developer</a></footer>
    </div>
  </body>
</html>
