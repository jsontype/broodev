<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사무라이 택틱스 2 — 턴제 검술 로그라이크 | broodev games</title>
    <meta name="description" content="한 줄 전장 위의 검술 두뇌 싸움. 기술패를 큐에 쌓고 한 호흡에 발동하는 턴제 로그라이크 — 적의 다음 수를 읽고 자리를 잡아라. 무료·설치 불필요." />
    <!-- 신규 앱 — 콘텐츠 보강 전까지 noindex, 광고 없음 -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://st2.broodev.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="사무라이 택틱스 2 — 턴제 검술 로그라이크" />
    <meta property="og:description" content="기술패를 쌓고, 한 호흡에 발동한다. 적의 예고를 읽는 1차원 전장 두뇌 싸움." />
    <style>
      :root {
        --bg: #12100d; --floor: #1d1914; --line: #3a3227; --washi: #e8ddc8;
        --ink: #d8cfc0; --dim: #8f8474; --red: #c9432f; --gold: #d9a441; --jade: #5fae7f;
        --font: 'Consolas', 'Menlo', ui-monospace, monospace;
        --ui: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: radial-gradient(ellipse at 50% -20%, #241f17 0%, var(--bg) 60%); color: var(--ink); font-family: var(--ui); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
      .wrap { width: 100%; max-width: 680px; padding: 14px 12px 40px; }
      header.top { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 10px; }
      .brand { font-family: var(--font); font-weight: 700; font-size: 16px; color: var(--gold); letter-spacing: 1px; }
      .brand small { color: var(--dim); font-weight: 400; letter-spacing: 0; }

      /* HUD */
      .hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-family: var(--font); font-size: 13px; }
      .hud .hp { color: var(--red); font-size: 15px; letter-spacing: 2px; }
      .hud .st { color: var(--dim); }
      .hud .score { margin-left: auto; color: var(--gold); }
      .hud .soul { color: #7fb7ff; letter-spacing: 2px; text-shadow: 0 0 8px rgba(127,183,255,.6); }
      .hud .mute { background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 13px; padding: 3px 7px; }
      .hud .giveup { background: none; border: 1px solid #5c2a20; border-radius: 6px; cursor: pointer; font-size: 11.5px; padding: 3px 8px; color: var(--dim); font-family: var(--ui); }
      .hud .giveup:hover { border-color: var(--red); color: var(--red); }
      .lane.quake { animation: quake .32s ease-in-out; }
      @keyframes quake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-5px, 2px); } 45% { transform: translate(4px, -2px); } 70% { transform: translate(-3px, 1px); } 88% { transform: translate(2px, 0); } }
      .fullflash { position: fixed; inset: 0; pointer-events: none; z-index: 50; background: radial-gradient(ellipse at 50% 45%, rgba(210,230,255,.9), rgba(127,183,255,.35) 55%, transparent 80%); animation: fullflash .3s ease-out forwards; }
      @keyframes fullflash { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }

      /* 전장 — 오리지널 나무마루 텍스처(CSS 그라디언트, 이미지 없음) */
      .lane { display: flex; gap: 5px; margin: 6px 0 4px; padding: 8px 6px 10px; border-radius: 8px; border: 1px solid #0d0a06; box-shadow: inset 0 2px 10px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 11px),
          repeating-linear-gradient(90deg, transparent 0 52px, rgba(0,0,0,.35) 52px 53px, rgba(255,255,255,.02) 53px 55px),
          linear-gradient(180deg, #332514 0%, #291d10 45%, #1e150b 100%); }
      .cell { flex: 1; aspect-ratio: 4/5; min-width: 0; background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.26)); border: 1px solid rgba(0,0,0,.4); box-shadow: inset 0 -8px 14px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.05); border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center; font-size: clamp(17px, 5.4vw, 30px); transition: background .15s; }
      .cell.tele { background: #3a1c15; border-color: var(--red); box-shadow: inset 0 0 12px rgba(201,67,47,.35); }
      .cell.tele::after { content: '⚠'; position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--red); }
      .cell.tele.tele2 { background: #5c1810; border-color: #ff5a3c; box-shadow: inset 0 0 18px rgba(255,90,60,.6), 0 0 8px rgba(201,67,47,.45); }
      .cell.tele.tele2::after { content: '⚠⚠'; color: #ff5a3c; text-shadow: 0 0 6px rgba(255,90,60,.8); }
      .unit { line-height: 0; position: relative; width: 94%; transform-origin: 50% 100%; animation: breathe 2s ease-in-out infinite; }
      .unit.pl { width: 100%; }
      .unit svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)); }
      .unit.flip svg { transform: scaleX(-1); }
      .hero-img { width: 100%; height: auto; display: block; image-rendering: pixelated; filter: drop-shadow(0 3px 4px rgba(0,0,0,.65)); }
      .unit.flip .hero-img { transform: scaleX(-1); }
      .unit.imgmode { width: 215%; margin-bottom: -6%; z-index: 2; }
      .unit.en.imgmode { width: 193%; } /* 일반 적 기본 10% 축소 */
      .unit.en.imgmode.sp-ronin2 { width: 215%; } /* 무사는 축소 금지 — 주인공과 동급 */
      .unit.imgmode .face { display: none; }
      .unit::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: -5px; height: 6px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); }
      .unit.boss { width: 96%; animation-duration: 3.2s; }
      @keyframes breathe { 0%, 100% { transform: scaleY(1) translateY(0); } 50% { transform: scaleY(.93) scaleX(1.02) translateY(2.4px); } }
      .unit.stance svg { filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)) drop-shadow(0 0 7px rgba(217,164,65,.85)); animation: stancePulse .9s ease-in-out infinite alternate; }
      @keyframes stancePulse { from { filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)) drop-shadow(0 0 4px rgba(217,164,65,.5)); } to { filter: drop-shadow(0 3px 4px rgba(0,0,0,.55)) drop-shadow(0 0 11px rgba(217,164,65,1)); } }
      .unit.atkR { animation: lungeR .3s ease-out; } .unit.atkL { animation: lungeL .3s ease-out; }
      @keyframes lungeR { 0% { transform: translateX(0); } 35% { transform: translateX(34%); } 100% { transform: translateX(0); } }
      @keyframes lungeL { 0% { transform: translateX(0); } 35% { transform: translateX(-34%); } 100% { transform: translateX(0); } }
      .unit.hurt { animation: shake .3s ease-in-out; }
      @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-9%); } 55% { transform: translateX(8%); } 80% { transform: translateX(-4%); } }
      .fx-slash { position: absolute; inset: 6% 2%; pointer-events: none; z-index: 3; }
      .fx-slash::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.95) 49%, rgba(217,164,65,.9) 52%, transparent 63%); animation: slashArc .32s ease-out forwards; border-radius: 8px; }
      @keyframes slashArc { 0% { transform: rotate(-65deg) scale(.55); opacity: 0; } 25% { opacity: 1; } 100% { transform: rotate(48deg) scale(1.25); opacity: 0; } }
      .fx-ehit { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: 6px; animation: ehitFlash .34s ease-out forwards; }
      @keyframes ehitFlash { 0% { box-shadow: inset 0 0 0 2px rgba(201,67,47,0); background: rgba(201,67,47,0); } 30% { box-shadow: inset 0 0 18px 4px rgba(201,67,47,.7); background: rgba(201,67,47,.28); } 100% { box-shadow: inset 0 0 0 0 rgba(201,67,47,0); background: rgba(201,67,47,0); } }
      @media (prefers-reduced-motion: reduce) { .unit, .unit svg, .fx-slash::before, .fx-ehit { animation: none !important; } }
      .unit .face { position: absolute; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--gold); }
      .unit .face.R { right: -12px; } .unit .face.L { left: -12px; }
      .unit .face { opacity: .8; }
      .unit .uhp { position: absolute; left: 50%; transform: translateX(-50%); bottom: -13px; font-size: 9px; letter-spacing: 1px; color: var(--red); white-space: nowrap; }
      .unit .u-int { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-family: var(--font); font-size: 10px; font-weight: 700; color: var(--warn); background: rgba(0,0,0,.55); border: 1px solid rgba(255,209,102,.5); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
      .unit .u-int.now { color: #fff; background: rgba(201,67,47,.85); border-color: var(--red); animation: intPulse .5s ease-in-out infinite alternate; }
      @keyframes intPulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.18); } }
      .unit.pl { color: var(--washi); } .unit.en { color: #d98d6a; } .unit.boss { color: var(--red); }
      .lane-idx { display: flex; gap: 5px; margin-bottom: 10px; }
      .lane-idx span { flex: 1; text-align: center; font-size: 9px; color: #4c443a; font-family: var(--font); }

      /* 예고/로그 */
      .intent { min-height: 20px; font-size: 12px; color: var(--dim); font-family: var(--font); margin-bottom: 8px; }
      .intent b { color: var(--red); font-weight: 600; }
      .log { min-height: 18px; font-size: 12px; color: var(--jade); font-family: var(--font); margin-bottom: 12px; }

      /* 큐 */
      .queue { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .q-label { font-size: 11px; color: var(--dim); font-family: var(--font); letter-spacing: 1px; }
      .q-slot { width: 44px; height: 44px; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--washi); background: rgba(0,0,0,.25); }
      .q-slot.full { border-style: solid; border-color: var(--gold); box-shadow: 0 0 10px rgba(217,164,65,.25); }
      .btn-strike { margin-left: auto; background: var(--red); color: #fff; border: 0; border-radius: 8px; font-family: var(--ui); font-weight: 800; font-size: 15px; padding: 11px 18px; cursor: pointer; }
      .btn-strike:disabled { opacity: .35; cursor: default; }
      .btn-soul { margin-left: auto; background: linear-gradient(135deg, #1d3a6e, #3a6ac0); color: #eaf3ff; border: 1px solid #7fb7ff; border-radius: 8px; font-weight: 800; font-size: 14px; padding: 10px 14px; cursor: pointer; text-shadow: 0 0 6px rgba(127,183,255,.8); }
      .btn-soul:not(:disabled) { animation: soulReady 1s ease-in-out infinite alternate; }
      @keyframes soulReady { from { box-shadow: 0 0 4px rgba(127,183,255,.4); } to { box-shadow: 0 0 16px rgba(127,183,255,.95); } }
      .btn-soul:disabled { opacity: .3; cursor: default; }
      .btn-soul + .btn-strike { margin-left: 8px; }
      .fx-dash { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; border-radius: 6px; }
      .fx-dash::before { content: ''; position: absolute; top: 42%; left: -30%; width: 160%; height: 16%; background: linear-gradient(90deg, transparent, rgba(127,183,255,.95), #fff, rgba(127,183,255,.95), transparent); animation: dashStreak .34s ease-out forwards; }
      .fx-dash::after { content: ''; position: absolute; inset: 0; background: rgba(127,183,255,.16); animation: ehitFlash .4s ease-out forwards; }
      @keyframes dashStreak { 0% { transform: translateX(-40%) scaleY(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(40%) scaleY(1); opacity: 0; } }

      /* 기술패 */
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 12px; }
      .tile { background: #241f17; border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px 7px; cursor: pointer; text-align: left; color: var(--ink); position: relative; font-family: var(--ui); }
      .tile:not(:disabled):hover { border-color: var(--gold); }
      .tile:disabled { opacity: .38; cursor: default; }
      .tile .t-head { display: flex; align-items: center; gap: 7px; }
      .t-ico { display: inline-flex; width: 26px; height: 26px; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
      .t-ico svg { width: 100%; height: 100%; }
      .q-slot .t-ico { width: 30px; height: 30px; }
      .q-slot.full { cursor: pointer; }
      .q-slot.full:hover { border-color: var(--gold); box-shadow: 0 0 8px rgba(217,164,65,.35); }
      .tile .t-name { font-weight: 700; font-size: 13px; }
      .tile .t-dmg { color: var(--red); font-weight: 800; font-size: 12px; margin-left: auto; text-shadow: 0 0 5px rgba(201,67,47,.4); }
      .rng { display: flex; gap: 2px; margin-top: 6px; }
      .rng i { width: 12px; height: 12px; border-radius: 2px; background: #17130d; border: 1px solid #2c2418; }
      .rng i.p { background: var(--gold); border-color: #8a6a2a; box-shadow: 0 0 4px rgba(217,164,65,.6); }
      .rng i.r { background: var(--red); border-color: #7e2019; box-shadow: 0 0 4px rgba(201,67,47,.6); }
      .rng i.R { background: #8f1408; border-color: #5c0d05; box-shadow: 0 0 6px rgba(201,67,47,.9); }
      .rng i.f { background: rgba(201,67,47,.35); border-color: #5c2a20; }
      .rng i.m { background: rgba(127,183,255,.35); border-color: #2c4a6e; }
      .cell.pv-hit { box-shadow: inset 0 0 0 2px rgba(127,183,255,.6); background: rgba(127,183,255,.18); }
      .cell.pv-path { box-shadow: inset 0 0 0 2px rgba(127,183,255,.3); background: rgba(127,183,255,.09); }
      .tile .t-info { font-size: 10.5px; color: var(--dim); margin-top: 2px; line-height: 1.45; }
      .tile .t-cd { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--red); font-family: var(--font); }

      /* 이동 조작 */
      .tile .t-key { position: absolute; right: 8px; bottom: 7px; font-family: var(--font); font-size: 10px; color: var(--dim); border: 1px solid #4a3c26; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: rgba(0,0,0,.3); }
      .moves { display: flex; gap: 8px; margin-bottom: 14px; }
      /* 모바일 축약 — 세로(좁은 폭)·가로(낮은 높이) 모두 스크롤 없이 한 화면 */
      @media (max-width: 640px), (max-height: 560px) {
        .wrap { padding: 6px 8px 10px; }
        header.top { padding: 2px 2px 4px; }
        header.top h1 { font-size: 16px; }
        .hud { gap: 8px; font-size: 11px; margin-bottom: 6px; }
        .cell { aspect-ratio: 1/1; font-size: clamp(14px, 4.5vw, 22px); }
        .log { margin-bottom: 4px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue { margin-bottom: 6px; }
        .q-slot .t-ico { width: 24px; height: 24px; }
        .btn-soul, .btn-strike { padding: 8px 10px; font-size: 13px; }
        .tiles { grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 8px; }
        .tiles .tile { padding: 6px 5px 5px; }
        .tiles .tile .t-info { display: none; }
        .tiles .tile .t-name { font-size: 11px; }
        .tile .t-key, .mbtn .m-lb, .mbtn kbd, .keys, footer { display: none; }
        .mbtn { padding: 8px 4px; }
        .mbtn .m-ico { font-size: 18px; }
        .moves { margin-bottom: 6px; }
        .rng i { width: 9px; height: 9px; }
        /* 타이틀(난이도 선택)·보상·종료(스코어보드) 화면도 한 화면에 */
        .screen h1 { font-size: 20px !important; margin: 4px 0 2px; }
        .screen .sub { font-size: 11px; margin-bottom: 8px; }
        .howto { display: none; }
        .diff-row { margin: 8px 0 0; gap: 5px; }
        .diff-btn { padding: 6px 9px; }
        .diff-btn span { display: none; }
        .big-btn { margin-top: 10px; }
        .board th, .board td { padding: 2px 8px; font-size: 10.5px; }
        .board-label { margin-top: 8px; }
        .ach-box { margin-top: 10px; }
        .reward-opts { gap: 5px; }
        .reward-opts .tile { padding-top: 8px; }
      }
      /* 가로 모드(낮은 높이): 기술 6열·전장 더 낮게 */
      @media (max-height: 560px) {
        .tiles { grid-template-columns: repeat(6, 1fr); }
        .cell { aspect-ratio: 5/4; }
      }
      .mbtn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; background: linear-gradient(180deg, #322a1e 0%, #241f15 55%, #1c170e 100%); border: 1px solid #4a3c26; border-radius: 10px; color: var(--ink); font-size: 13.5px; padding: 11px 4px; cursor: pointer; font-family: var(--ui); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 6px rgba(0,0,0,.35), 0 2px 5px rgba(0,0,0,.4); transition: transform .08s, box-shadow .08s, border-color .12s; }
      .mbtn:hover { border-color: var(--gold); transform: translateY(-1px); }
      .mbtn:active { transform: translateY(1px); box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
      .mbtn .m-ico { color: var(--gold); font-size: 15px; text-shadow: 0 0 6px rgba(217,164,65,.5); }
      .mbtn .m-lb { font-weight: 700; letter-spacing: .5px; }
      .mbtn kbd { font-family: var(--font); font-size: 10px; color: var(--dim); border: 1px solid #4a3c26; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: rgba(0,0,0,.3); }
      .keys { font-size: 11px; color: #5d5344; text-align: center; font-family: var(--font); }
      .ach-box { margin: 20px auto 0; max-width: 470px; color: var(--dim); font-family: var(--ui); text-align: center; }
      .ach-box summary { cursor: pointer; font-size: 13px; color: var(--gold); list-style-position: inside; }
      .ach-grid { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 10px; }
      .ach-gem { font-size: 21px; line-height: 1; cursor: help; color: hsl(var(--h), 75%, 62%); text-shadow: 0 0 9px hsla(var(--h), 80%, 60%, .65); }
      .ach-gem.lock { color: #383126; text-shadow: none; }
      .diff-row { display: flex; gap: 8px; justify-content: center; margin: 16px 0 2px; flex-wrap: wrap; }
      .diff-btn { display: flex; flex-direction: column; gap: 2px; align-items: center; background: #1c170e; border: 1px solid #4a3c26; border-radius: 8px; color: var(--dim); padding: 8px 12px; cursor: pointer; font-family: var(--ui); }
      .diff-btn b { color: var(--ink); font-size: 13px; }
      .diff-btn span { font-size: 10px; }
      .diff-btn.sel { border-color: var(--gold); box-shadow: 0 0 10px rgba(217,164,65,.35); }
      .diff-btn.sel b { color: var(--gold); }
      .uhp .uarm { color: #7fb7ff; text-shadow: 0 0 5px rgba(127,183,255,.7); }

      /* 오버레이 화면 */
      .screen { border: 1px solid var(--line); background: rgba(20,17,13,.96); border-radius: 12px; padding: 28px 22px; text-align: center; }
      .screen h1 { font-size: 30px; margin: 0 0 4px; color: var(--washi); letter-spacing: 3px; }
      .screen h1 .two { color: var(--red); }
      .screen .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
      .screen .big-btn { background: var(--red); color: #fff; border: 0; border-radius: 10px; font-size: 17px; font-weight: 800; padding: 13px 34px; cursor: pointer; margin-top: 8px; }
      .howto { text-align: left; max-width: 460px; margin: 14px auto 0; font-size: 12.5px; color: var(--dim); line-height: 1.75; }
      .howto b { color: var(--ink); }
      .stat { font-family: var(--font); font-size: 14px; color: var(--gold); margin: 8px 0; }
      .board-label { margin-top: 14px; font-size: 11px; color: var(--dim); font-family: var(--font); }
      .board { margin: 8px auto 0; border-collapse: collapse; font-family: var(--font); font-size: 11.5px; color: var(--dim); }
      .board th, .board td { padding: 3px 11px; border-bottom: 1px dashed rgba(255,255,255,.1); text-align: center; }
      .board th { color: var(--gold); font-weight: 600; }
      .board tr.me td { color: #cba6ff; background: rgba(138,92,255,.16); text-shadow: 0 0 6px rgba(138,92,255,.5); font-weight: 700; }
      footer { margin-top: 22px; color: #5d5344; font-size: 11px; text-align: center; }
      footer a { color: var(--dim); }
      .reward-opts { display: grid; gap: 8px; max-width: 420px; margin: 14px auto 0; }
      .reward-opts .tile { text-align: center; position: relative; padding-top: 12px; }
      .reward-opts .tile.rare { border-color: #8a5cff; box-shadow: 0 0 14px rgba(138,92,255,.35), inset 0 0 22px rgba(138,92,255,.08); }
      .reward-opts .tile.rare .t-name { color: #b98cff; text-shadow: 0 0 8px rgba(138,92,255,.55); }
      .reward-opts .tile.rare .r-num { border-color: #8a5cff; color: #b98cff; }

          var targets = S.foes.filter(function (f2) { return f2.hp > 0 && (d2 > 0 ? f2.pos > p.pos : f2.pos < p.pos); });
          if (!targets.length) { S.log = '전방에 벨 적이 없다.'; render(); return; }
          S.soulCasting = true; /* 오의로 벤 적은 혼을 되돌려주지 않는다 (무한 연쇄 방지) */
          FX.atk = true; FX.dash = []; FX.flash = true; FX.quake = true;
          SFX.pierce();
          var far = p.pos;
          targets.forEach(function (f2) { if (d2 > 0 ? f2.pos > far : f2.pos < far) far = f2.pos; });
          var landing = far + d2;
          if (!inBoard(landing)) landing = far;
          for (var cpos = p.pos + d2; d2 > 0 ? cpos <= far : cpos >= far; cpos += d2) FX.dash.push(cpos);
          targets.forEach(function (f2) { hitFoe(f2, S.soulDmg, '일섬'); });
          while (foeAt(landing) && landing !== p.pos) landing -= d2;
          p.pos = landing;
          S.soulCasting = false;
          S.soul = 0;
          var sc2 = statAdd('soul');
          if (sc2 >= 1) unlock('soul_first');
          if (sc2 >= 10) unlock('soul_10');
          if (targets.length >= 3) unlock('pierce_3');
          if (targets.length >= 5) unlock('pierce_5');
          S.log = '오의 · 일섬(一閃)! 전방을 꿰뚫었다 — ' + targets.length + '명 관통';
        } else if (type === 'strike') {
          if (!S.queue.length) return;
          if (S.queue.length >= QMAX) unlock('combo_full');
          FX.atk = true;
          SFX.slash();
          var names = [];
          S.queue.forEach(function (idx) { var tl = S.tiles[idx]; names.push(tl.name); execTile(tl); if (S.over) return; });
          S.queue = [];
          S.log = '발동! ' + names.join(' → ') + (S.log ? ' · ' + S.log : '');
        } else return;
        afterAction();
      }
      function score() { return S.kills * 10 + (S.stage * 3 + S.wave) * 25 + (S.won ? 500 : 0); }
      function saveBest() {
        try { var b = +localStorage.getItem('st2:best') || 0; if (score() > b) localStorage.setItem('st2:best', String(score())); } catch (e) {}
        recordRun();
      }
      /* 난이도별 보드 분리 — 입문은 기존 키 그대로(기록 보존) */
      function boardKey(d) { return 'st2:board' + (d ? ':d' + d : ''); }
      function loadBoard(d) { try { return JSON.parse(localStorage.getItem(boardKey(d)) || '[]'); } catch (e) { return []; } }
      function recordRun() {
        try {
          var b = loadBoard(S.diff);
          b.push({ s: score(), st: S.stage + 1, k: S.kills, w: S.won ? 1 : 0, d: new Date().toISOString().slice(0, 10) });
          b.sort(function (x, y) { return y.s - x.s; });
          localStorage.setItem(boardKey(S.diff), JSON.stringify(b.slice(0, 10)));
        } catch (e) {}
      }
      function boardHtml(cur, dIdx) {
        var b = loadBoard(dIdx || 0);
        if (!b.length) return '';
        var hi = cur != null ? b.findIndex(function (r) { return r.s === cur; }) : -1;
        var rows = b.slice(0, 5).map(function (r, i) {
          return '<tr' + (i === hi ? ' class="me"' : '') + '><td>' + (i + 1) + '</td><td>' + r.s + '</td><td>' + (r.w ? '천하통일' : 'S' + r.st) + '</td><td>' + r.k + '</td><td>' + r.d + '</td></tr>';
        }).join('');
        if (hi >= 5) { /* 방금 런이 5위 밖 — 자기 순위 행을 따로 붙인다 */
          var mr = b[hi];
          rows += '<tr class="me"><td>' + (hi + 1) + '</td><td>' + mr.s + '</td><td>' + (mr.w ? '천하통일' : 'S' + mr.st) + '</td><td>' + mr.k + '</td><td>' + mr.d + '</td></tr>';
        }
        return '<div class="board-label">— 나의 기록 · ' + DIFFS[dIdx || 0].name + ' (이 브라우저) —</div><table class="board"><tr><th>#</th><th>점수</th><th>도달</th><th>격파</th><th>날짜</th></tr>' + rows + '</table>';
      }
      function best() { try { return +localStorage.getItem('st2:best') || 0; } catch (e) { return 0; } }

      /* ---- 렌더 ---- */
      var $g = document.getElementById('game');
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      function render() {
        if (!S || S.screen === 'title') { $g.innerHTML = titleHtml(); wire(); return; }
        if ((S.over || S.won) && !S.lock) { $g.innerHTML = endHtml(); wire(); return; }
        if (S.reward) { $g.innerHTML = rewardHtml(); wire(); return; }
        var teleCells = {}; /* 빨간 위험 표시는 집행 직전 턴(delay 1)에만 — 차지 중엔 ⚔ 배지가 경고 */
        S.foes.forEach(function (f) { if (f.intent && f.intent.delay <= 1) f.intent.cells.forEach(function (c) { teleCells[c] = (teleCells[c] || 0) + 1; }); });
        /* 기술패 호버 미리보기 — 스트립과 같은 색(빨강=타격, 파랑=이동, 연빨강=관통 경로) */
        var pvCells = {};
        if (hoverTile != null && S.tiles[hoverTile]) {
          var pk = S.tiles[hoverTile].key, pdv = S.p.dir, pp = S.p.pos;
          var mark = function (pos, cls) { if (inBoard(pos) && !pvCells[pos]) pvCells[pos] = cls; };
          if (pk === 'seg') mark(pp + pdv, 'pv-hit');
          else if (pk === 'bal') { mark(pp + pdv, 'pv-hit'); mark(pp + 2 * pdv, 'pv-hit'); }
          else if (pk === 'hoe') { mark(pp + 1, 'pv-hit'); mark(pp - 1, 'pv-hit'); }
          else if (pk === 'su') { for (var sq = pp + pdv; inBoard(sq); sq += pdv) { if (foeAt(sq)) { mark(sq, 'pv-hit'); break; } mark(sq, 'pv-path'); } }
          else if (pk === 'mil') { mark(pp + pdv, 'pv-hit'); }
          else if (pk === 'brk') {
            var farP = null;
            for (var b1 = pp + pdv; inBoard(b1); b1 += pdv) if (foeAt(b1)) farP = b1;
            if (farP == null) { for (var b2 = pp + pdv; inBoard(b2); b2 += pdv) mark(b2, 'pv-path'); }
            else for (var b3 = pp + pdv; pdv > 0 ? b3 <= farP : b3 >= farP; b3 += pdv) mark(b3, foeAt(b3) ? 'pv-hit' : 'pv-path');
          }
          else if (pk === 'dol') { var dp = pp, ds = 0; while (ds < 3 && inBoard(dp + pdv) && !foeAt(dp + pdv)) { dp += pdv; ds++; mark(dp, 'pv-path'); } mark(dp + pdv, 'pv-hit'); }
        }
        var cells = '';
        for (var i = 0; i < W; i++) {
          var inner = '';
          if (S.p.pos === i) {
            var qFirst = S.queue.length ? S.tiles[S.queue[0]].key : null;
            var pose = FX.atk ? 'player_atk' : (qFirst ? (qFirst === 'su' ? 'player_shuriken' : 'player_iai') : 'player');
            var imgPose = FX.atk && FX.threw ? 'player_throw' : pose; /* 던지기는 이미지 전용 포즈(도트 폴백은 atk) */
            var pCls = 'unit pl' + (S.p.dir < 0 ? ' flip' : '') +
              (FX.atk ? (S.p.dir > 0 ? ' atkR' : ' atkL') : '') +
              (!FX.atk && S.queue.length ? ' stance' : '') +
              (FX.hurtP ? ' hurt' : '');
            var heroImg = heroSrc(imgPose);
            var heroBody = heroImg ? '<img class="hero-img" src="' + heroImg + '" alt="" />' : unitSvg(pose);
            inner = '<span class="' + pCls + (heroImg ? ' imgmode' : '') + '" data-pose="' + imgPose + '">' + heroBody + '<span class="face ' + (S.p.dir > 0 ? 'R' : 'L') + '">' + (S.p.dir > 0 ? '▶' : '◀') + '</span></span>';
          } else {
            var f = foeAt(i);
            if (f) {
              var lookLeft = S.p.pos < f.pos;
              var striking = FX.fatk.indexOf(f.pos) >= 0;
              var fSuf = striking ? '_atk' : f.intent ? '_ready' : '';
              var fImg = foeSrc(FOE_DEFS[f.type].sprite, fSuf);
              var eCls = 'unit ' + (FOE_DEFS[f.type].boss ? 'boss' : 'en') + ' sp-' + FOE_DEFS[f.type].sprite + (lookLeft ? ' flip' : '') + (FX.hurt.indexOf(i) >= 0 ? ' hurt' : '') +
                (striking ? (lookLeft ? ' atkL' : ' atkR') : '') + (fImg ? ' imgmode' : '');
              var fBody = fImg ? '<img class="hero-img" src="' + fImg + '" alt="" />' : unitSvg(FOE_DEFS[f.type].sprite);
              var intentBadge = f.intent ? '<span class="u-int' + (f.intent.delay <= 1 ? ' now' : '') + '">⚔' + f.intent.delay + (f.dbl ? '×2' : '') + '</span>' : '';
              inner = '<span class="' + eCls + '">' + fBody + intentBadge + '<span class="uhp">' + '●'.repeat(Math.max(0, f.hp)) + ((f.armor || 0) > 0 ? '<span class="uarm">' + '●'.repeat(f.armor) + '</span>' : '') + '</span></span>';
            }
          }
          if (FX.dash.indexOf(i) >= 0) inner += '<span class="fx-dash"></span>';
          if (FX.slash.indexOf(i) >= 0) inner += '<span class="fx-slash"></span>';
          if (FX.ehit.indexOf(i) >= 0) inner += '<span class="fx-ehit"></span>';
          cells += '<div class="cell' + (teleCells[i] ? ' tele' + (teleCells[i] > 1 ? ' tele2' : '') : '') + (pvCells[i] ? ' ' + pvCells[i] : '') + '">' + inner + '</div>';
        }
        var idx = ''; for (var j = 0; j < W; j++) idx += '<span>' + (j + 1) + '</span>';
        var intents = S.foes.filter(function (f) { return f.intent; }).map(function (f) { return f.name + ' → <b>' + f.intent.cells.map(function (c) { return c + 1; }).join('·') + '칸</b>'; });
        var qs = '';
        for (var q = 0; q < QMAX; q++) {
          var ti = S.queue[q] != null ? S.tiles[S.queue[q]] : null;
          qs += '<div class="q-slot' + (ti ? ' full' : '') + '"' + (ti ? ' data-qs="' + q + '" title="클릭: 순서 변경"' : '') + '>' + (ti ? '<span class="t-ico">' + (TILE_ICONS[ti.key] || ti.glyph) + '</span>' : '') + '</div>';
        }
        var tiles = S.tiles.map(function (t, i2) {
          var qd = S.queue.indexOf(i2) >= 0;
          return '<button class="tile" data-q="' + i2 + '" ' + (t.cdLeft > 0 || qd || S.queue.length >= QMAX ? 'disabled' : '') + '>' +
            (t.cdLeft > 0 ? '<span class="t-cd">' + t.cdLeft + '</span>' : '') +
            '<div class="t-head"><span class="t-ico">' + (TILE_ICONS[t.key] || '') + '</span><span class="t-name">' + esc(t.name) + '</span>' + (t.dmg > 0 ? '<span class="t-dmg">' + t.dmg + '딜' + (TILE_DEFS[t.key].hits > 1 ? '×' + TILE_DEFS[t.key].hits : '') + '</span>' : '') + '</div>' +
            '<div class="t-info">' + TILE_DEFS[t.key].info(t) + ' · 쿨 ' + t.cd + '턴</div>' +
            rngHtml(t.key) + '<kbd class="t-key">' + (i2 + 1) + '</kbd></button>';
        }).join('');
        $g.innerHTML =
          '<div class="hud"><span class="hp">' + '♥'.repeat(S.p.hp) + '<span style="opacity:.25">' + '♥'.repeat(Math.max(0, S.p.maxHp - S.p.hp)) + '</span></span>' +
          '<span class="st">STAGE ' + (S.stage + 1) + '/12 · ' + DIFFS[S.diff || 0].name + ' · WAVE ' + (S.wave + 1) + ' · TURN ' + S.turn + '</span>' +
          '<span class="soul" title="적을 격파하면 혼이 차오른다">魂 ' + '●'.repeat(S.soul) + '<span style="opacity:.3">' + '●'.repeat(Math.max(0, S.soulMax - S.soul)) + '</span></span>' +
          '<span class="score">SCORE ' + score() + '</span>' +
          '<button class="mute" id="mute" title="사운드 켜기/끄기">' + (AU.muted ? '🔇' : '🔊') + '</button>' +
          '<button class="giveup" id="giveup" title="항복하고 처음부터">' + (surrenderArm ? '정말?' : '🏳 항복') + '</button></div>' +
          '<div class="lane' + (FX.quake ? ' quake' : '') + '">' + cells + '</div><div class="lane-idx">' + idx + '</div>' +
          (FX.flash ? '<div class="fullflash"></div>' : '') +
          '<div class="intent">' + (intents.length ? '⚠ 예고: ' + intents.join(' · ') : '적이 다음 수를 노린다…') + '</div>' +
          '<div class="log">» ' + S.log + '</div>' +
          '<div class="queue"><span class="q-label">COMBO</span>' + qs + '<button class="btn-soul" id="soul" ' + (S.soul >= S.soulMax ? '' : 'disabled') + '>魂 일섬</button>' +
          '<button class="btn-strike" id="strike" ' + (S.queue.length ? '' : 'disabled') + '>발동!</button></div>' +
          '<div class="tiles">' + tiles + '</div>' +
          '<div class="moves">' +
          '<button class="mbtn" data-a="left"><span class="m-ico">◀</span><span class="m-lb">이동</span><kbd>A</kbd></button>' +
          '<button class="mbtn" data-a="flip"><span class="m-ico">⇄</span><span class="m-lb">전환</span><kbd>W</kbd></button>' +
          '<button class="mbtn" data-a="wait"><span class="m-ico">❞</span><span class="m-lb">대기</span><kbd>S</kbd></button>' +
          '<button class="mbtn" data-a="right"><span class="m-ico">▶</span><span class="m-lb">이동</span><kbd>D</kbd></button></div>' +
          '<div class="keys">키보드: A·D 이동 · W 전환 · S 대기 · 1~6 기술패 · Q 콤보 순서 · Space 발동 · E 魂일섬</div>';
        wire();
      }
      function titleHtml() {
        return '<div class="screen"><h1>사무라이 택틱스 <span class="two">2</span></h1>' +
          '<div class="sub">한 줄 전장 · 큐 콤보 · 예고를 읽는 검술 두뇌전</div>' +
          '<div class="stat">BEST SCORE ' + best() + '</div>' + boardHtml(null, curDiff()) +
          '<div class="diff-row">' + DIFFS.map(function (df, i2) { return '<button class="diff-btn' + (i2 === curDiff() ? ' sel' : '') + '" data-diff="' + i2 + '"><b>' + df.name + '</b><span>' + df.desc + '</span></button>'; }).join('') + '</div>' +
          '<button class="big-btn" id="start">' + DIFFS[curDiff()].name + ' (시작)</button>' +
          '<div class="howto"><b>규칙.</b> 모든 행동은 1턴이고, 그때마다 적도 움직인다.<br />' +
          '적은 공격 전에 <b>⚠로 예고</b>한다 — 예고된 칸을 피하거나, 그 전에 베어라.<br />' +
          '기술패를 <b>콤보 큐(최대 3)</b>에 쌓고 <b>발동</b>하면 한 호흡에 집행된다. 사용한 패는 쿨다운.<br />' +
          '기술은 <b>바라보는 방향(▶/◀)</b>으로 나간다. 등 뒤는 <b>⇄ 전환</b>으로 지켜라.<br />' +
          '적을 격파하면 <b>혼(魂)</b>이 차오른다. 게이지가 가득 차면 오의 <b>일섬(一閃)</b> — 전방의 모든 적을 <b>관통하며 베어</b> 반대편으로 빠져나간다.<br />' +
          '웨이브를 이기면 보상 — 새 기술·강화·회복. <b>다이묘</b>가 3·6·9 스테이지마다 길을 막고, <b>12 스테이지의 쇼군</b>을 베면 천하통일.</div>' + achHtml() + '</div>';
      }
      function rewardHtml() {
        var giveN = S.reward.length + 1;
        return '<div class="screen"><h1 style="font-size:22px">승리의 대가</h1><div class="sub">하나를 고르시오 — 숫자키 <b>1~' + S.reward.length + '</b> (' + giveN + ' = 항복)</div><div class="reward-opts">' +
          S.reward.map(function (o, i) { return '<button class="tile' + (o.rare === 2 ? ' legend' : o.rare ? ' rare' : '') + '" data-r="' + i + '"><span class="r-num">' + (i + 1) + '</span><div class="t-name">' + esc(o.label) + '</div><div class="t-info">' + esc(o.desc) + '</div></button>'; }).join('') +
          '<button class="tile r-giveup" data-r="give"><span class="r-num">' + giveN + '</span><div class="t-name">🏳 항복</div><div class="t-info">런을 포기하고 초기 화면으로</div></button>' +
          '</div></div>';
      }
      function endHtml() {
        return '<div class="screen"><h1 style="font-size:26px">' + (S.won ? '천하통일' : '낙명(落命)') + '</h1>' +
          '<div class="sub">' + (S.won ? '쇼군을 베었다. 그대의 검이 시대를 갈랐다.' : 'STAGE ' + (S.stage + 1) + '에서 쓰러졌다. 검은 다시 잡는 자의 것.') + '</div>' +
          '<div class="stat">SCORE ' + score() + ' · BEST ' + best() + ' · 격파 ' + S.kills + '</div>' + boardHtml(score(), S.diff) +
          '<button class="big-btn" id="start">' + (S.won ? '한 번 더' : '재도전') + '</button></div>';
      }
      function wire() {
        var st = document.getElementById('start'); if (st) st.onclick = newRun;
        var ab = $g.querySelectorAll('.ach-box')[0];
        if (ab) ab.ontoggle = function () { try { localStorage.setItem('st2:achOpen', ab.open ? '1' : ''); } catch (err) {} };
        Array.prototype.forEach.call($g.querySelectorAll('[data-diff]'), function (b) {
          b.onclick = function () { try { localStorage.setItem('st2:diff', b.dataset.diff); } catch (err) {} $g.innerHTML = titleHtml(); wire(); };
        });
        var sk = document.getElementById('strike'); if (sk) sk.onclick = function () { act('strike'); };
        var so = document.getElementById('soul'); if (so) so.onclick = function () { act('soul'); };
        var mu = document.getElementById('mute'); if (mu) mu.onclick = toggleMute;
        var gu = document.getElementById('giveup');
        if (gu) gu.onclick = function () {
          if (surrenderArm) { clearTimeout(surrenderArm); surrenderArm = 0; SFX.die(); goTitle(); return; }
          surrenderArm = setTimeout(function () { surrenderArm = 0; if (S && S.screen === 'play') render(); }, 2200);
          render();
        };
        Array.prototype.forEach.call($g.querySelectorAll('[data-a]'), function (b) {
          b.onclick = function () { act(b.dataset.a === 'left' ? 'move' : b.dataset.a === 'right' ? 'move' : b.dataset.a, b.dataset.a === 'left' ? -1 : b.dataset.a === 'right' ? 1 : undefined); };
        });
        Array.prototype.forEach.call($g.querySelectorAll('[data-qs]'), function (b) { b.onclick = function () { cycleQueue(+b.dataset.qs); }; });
        Array.prototype.forEach.call($g.querySelectorAll('[data-q]'), function (b) {
          b.onclick = function () { act('queue', +b.dataset.q); };
          b.onmouseenter = function () { var v = +b.dataset.q; if (hoverTile !== v) { hoverTile = v; if (S.screen === 'play' && !S.reward) render(); } };
          b.onmouseleave = function () { if (hoverTile != null) { hoverTile = null; if (S.screen === 'play' && !S.reward) render(); } };
        });
        Array.prototype.forEach.call($g.querySelectorAll('[data-r]'), function (b) { b.onclick = function () { if (b.dataset.r === 'give') { SFX.die(); goTitle(); } else pickReward(+b.dataset.r); }; });
      }
      document.addEventListener('keydown', function (e) {
        if (!S) return;
        if (S.reward) {
          var rn = +e.key;
          if (rn >= 1 && rn <= S.reward.length && S.reward[rn - 1]) pickReward(rn - 1);
          else if (rn === S.reward.length + 1) { SFX.die(); goTitle(); }
          return;
        }
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') act('move', -1);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') act('move', 1);
        else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') act('flip');
        else if (e.key === ' ') { e.preventDefault(); act('strike'); }
        else if (e.key === 's' || e.key === 'S') act('wait');
        else if (e.key === 'q' || e.key === 'Q') cycleQueue(0);
        else if (e.key === 'e' || e.key === 'E') act('soul');
        else if (e.key >= '1' && e.key <= '6') act('queue', +e.key - 1);
      });

      /* 테스트 훅 (스텁 검증용) */
      window.__ST2__ = { newRun: newRun, act: act, pickReward: pickReward, cycle: cycleQueue, state: function () { return S; }, hover: function (i) { hoverTile = i; if (S && S.screen === 'play') render(); } };

      /* 타이틀부터 */
      S = null; render();
    </script>
  </body>
</html>
