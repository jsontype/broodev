    <!-- 신규 앱 — 콘텐츠 보강 전까지 noindex, 광고 없음 -->

    <meta property="og:description" content="기술패를 쌓고, 한 호흡에 발동한다. 적의 예고를 읽는 1차원 전장 두뇌 싸움." />
    <style>
      :root {
        --bg: #12100d; --floor: #1d1914; --line: #3a3227; --washi: #e8ddc8;
        --ink: #d8cfc0; --dim: #8f8474; --red: #c9432f; --gold: #d9a441; --jade: #5fae7f;
        --font: 'Consolas', 'Menlo', ui-monospace, monospace;
        --ui: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: radial-gradient(ellipse at 50% -20%, #241f17 0%, var(--bg) 60%); color: var(--ink); font-family: var(--ui); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
      .wrap { width: 100%; max-width: 680px; padding: 14px 12px 40px; }
      header.top { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px 10px; }
      .brand { font-family: var(--font); font-weight: 700; font-size: 16px; color: var(--gold); letter-spacing: 1px; }
      .brand small { color: var(--dim); font-weight: 400; letter-spacing: 0; }

      /* HUD */
      .hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; font-family: var(--font); font-size: 13px; }
      .hud .hp { color: var(--red); font-size: 15px; letter-spacing: 2px; }
      .hud .st { color: var(--dim); }
      .hud .score { margin-left: auto; color: var(--gold); }

      /* 전장 */
      .lane { display: flex; gap: 5px; margin: 6px 0 4px; }
      .cell { flex: 1; aspect-ratio: 4/5; min-width: 0; background: var(--floor); border: 1px solid var(--line); border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center; font-size: clamp(17px, 5.4vw, 30px); transition: background .15s; }
      .cell.tele { background: #3a1c15; border-color: var(--red); box-shadow: inset 0 0 12px rgba(201,67,47,.35); }
      .cell.tele::after { content: '⚠'; position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--red); }
      .unit { line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.6); position: relative; }
      .unit .face { position: absolute; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--gold); }
      .unit .face.R { right: -11px; } .unit .face.L { left: -11px; }
      .unit .uhp { position: absolute; left: 50%; transform: translateX(-50%); bottom: -13px; font-size: 9px; letter-spacing: 1px; color: var(--red); white-space: nowrap; }
      .unit.pl { color: var(--washi); } .unit.en { color: #d98d6a; } .unit.boss { color: var(--red); }
      .lane-idx { display: flex; gap: 5px; margin-bottom: 10px; }
      .lane-idx span { flex: 1; text-align: center; font-size: 9px; color: #4c443a; font-family: var(--font); }

      /* 예고/로그 */
      .intent { min-height: 20px; font-size: 12px; color: var(--dim); font-family: var(--font); margin-bottom: 8px; }
      .intent b { color: var(--red); font-weight: 600; }
      .log { min-height: 18px; font-size: 12px; color: var(--jade); font-family: var(--font); margin-bottom: 12px; }

      /* 큐 */
      .queue { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .q-label { font-size: 11px; color: var(--dim); font-family: var(--font); letter-spacing: 1px; }
      .q-slot { width: 44px; height: 44px; border: 1px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--washi); background: rgba(0,0,0,.25); }
      .q-slot.full { border-style: solid; border-color: var(--gold); box-shadow: 0 0 10px rgba(217,164,65,.25); }
      .btn-strike { margin-left: auto; background: var(--red); color: #fff; border: 0; border-radius: 8px; font-family: var(--ui); font-weight: 800; font-size: 15px; padding: 11px 18px; cursor: pointer; }
      .btn-strike:disabled { opacity: .35; cursor: default; }

      /* 기술패 */
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 12px; }
      .tile { background: #241f17; border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px 7px; cursor: pointer; text-align: left; color: var(--ink); position: relative; font-family: var(--ui); }
      .tile:not(:disabled):hover { border-color: var(--gold); }
      .tile:disabled { opacity: .38; cursor: default; }
      .tile .t-name { font-weight: 700; font-size: 13px; }
      .tile .t-info { font-size: 10.5px; color: var(--dim); margin-top: 2px; line-height: 1.45; }
      .tile .t-cd { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--red); font-family: var(--font); }

      /* 이동 조작 */
      .moves { display: flex; gap: 8px; margin-bottom: 14px; }
      .mbtn { flex: 1; background: #241f17; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 14px; padding: 11px 4px; cursor: pointer; font-family: var(--ui); }
      .mbtn:hover { border-color: var(--washi); }
      .keys { font-size: 11px; color: #5d5344; text-align: center; font-family: var(--font); }

      /* 오버레이 화면 */
      .screen { border: 1px solid var(--line); background: rgba(20,17,13,.96); border-radius: 12px; padding: 28px 22px; text-align: center; }
      .screen h1 { font-size: 30px; margin: 0 0 4px; color: var(--washi); letter-spacing: 3px; }
      .screen h1 .two { color: var(--red); }
      .screen .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
      .screen .big-btn { background: var(--red); color: #fff; border: 0; border-radius: 10px; font-size: 17px; font-weight: 800; padding: 13px 34px; cursor: pointer; margin-top: 8px; }
      .howto { text-align: left; max-width: 460px; margin: 14px auto 0; font-size: 12.5px; color: var(--dim); line-height: 1.75; }
      .howto b { color: var(--ink); }
      .stat { font-family: var(--font); font-size: 14px; color: var(--gold); margin: 8px 0; }
      footer { margin-top: 22px; color: #5d5344; font-size: 11px; text-align: center; }
      footer a { color: var(--dim); }
      .reward-opts { display: grid; gap: 8px; max-width: 420px; margin: 14px auto 0; }
      .reward-opts .tile { text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <span class="brand">⚔ 사무라이 택틱스 <span style="color:var(--red)">2</span> <small>· 턴제 검술 로그라이크</small></span>
      </header>
      <main id="game"></main>
      <footer>
        오리지널 게임 · 진행 상황은 이 브라우저(localStorage)에만 저장됩니다<br />
        © 2026 broodev · Y-Systems · <a href="mailto:jsontyper@gmail.com">jsontyper@gmail.com</a>
      </footer>
    </div>

    <script>
      'use strict';

      /* =========================================================
       * 사무라이 택틱스 2 — 오리지널 룰
       *  - 한 줄 전장(9칸), 향(向) 개념: 기술은 바라보는 방향으로 나간다
       *  - 기술패를 큐(최대 3)에 쌓고 "발동"으로 한 번에 집행, 사용한 패는 쿨다운
       *  - 모든 행동(이동/전환/쌓기/대기/발동)이 1턴 → 적도 1턴 움직인다
       *  - 적은 공격을 1턴 예고(⚠)한 뒤 다음 턴에 집행한다
       * ========================================================= */
      var W = 9, QMAX = 3;

      /* 기술패 도감 (오리지널) */
      var TILE_DEFS = {
        seg:  { key: 'seg',  name: '베기',   glyph: '斬', cd: 2, dmg: 1, info: function (t) { return '전방 1칸 ' + t.dmg + '딜'; } },
        jji:  { key: 'jji',  name: '찌르기', glyph: '突', cd: 3, dmg: 1, info: function (t) { return '전방 2칸째 ' + t.dmg + '딜'; } },
        hoe:  { key: 'hoe',  name: '회전베기', glyph: '旋', cd: 4, dmg: 1, info: function (t) { return '양옆 1칸 ' + t.dmg + '딜'; } },
        su:   { key: 'su',   name: '수리검', glyph: '手', cd: 3, dmg: 1, info: function (t) { return '전방 직선 첫 적 ' + t.dmg + '딜'; } },
        mil:  { key: 'mil',  name: '밀치기', glyph: '押', cd: 2, dmg: 0, info: function (t) { return '전방 적 2칸 넉백' + (t.dmg ? ' +' + t.dmg + '딜' : '') + ' (벽 충돌 시 1딜)'; } },
        dol:  { key: 'dol',  name: '돌진',   glyph: '走', cd: 4, dmg: 1, info: function (t) { return '전방 2칸 이동 후 ' + t.dmg + '딜'; } },
        bal:  { key: 'bal',  name: '발도술', glyph: '拔', cd: 5, dmg: 2, info: function (t) { return '전방 1칸 ' + t.dmg + '딜'; } },
      };

      /* 적 도감 (오리지널) */
      var FOE_DEFS = {
        ronin:  { glyph: '浪', name: '낭인',  hp: 1, spd: 1, rng: [1] },
        archer: { glyph: '弓', name: '궁수',  hp: 1, spd: 1, rng: [2, 3, 4] },
        spear:  { glyph: '槍', name: '창병',  hp: 2, spd: 1, rng: [1, 2] },
        nin:    { glyph: '忍', name: '자객',  hp: 1, spd: 2, rng: [1] },
        monk:   { glyph: '僧', name: '승병',  hp: 3, spd: 1, rng: [1], both: true },
        daimyo: { glyph: '大', name: '다이묘', hp: 8, spd: 1, rng: [1, 2], boss: true },
      };

      /* 스테이지 구성: 3스테이지 × 3웨이브, 마지막은 보스 */
      var WAVES = [
        [['ronin'], ['ronin', 'ronin'], ['ronin', 'archer']],
        [['spear', 'ronin'], ['archer', 'nin'], ['spear', 'archer', 'ronin']],
        [['nin', 'nin', 'archer'], ['monk', 'spear'], ['daimyo']],
      ];

      var S = null; /* 게임 상태 */
      var uid = 1;

      function newRun() {
        S = {
          screen: 'play', stage: 0, wave: 0, turn: 0, kills: 0,
          p: { pos: 4, dir: 1, hp: 3, maxHp: 3 },
          tiles: [mkTile('seg'), mkTile('jji'), mkTile('su')],
          queue: [], foes: [], log: '무사의 길이 열렸다. 적의 예고(⚠)를 읽어라.',
          over: false, won: false, reward: null,
        };
        spawnWave();
        render();
      }
      function mkTile(key) { var d = TILE_DEFS[key]; return { key: key, name: d.name, glyph: d.glyph, cd: d.cd, dmg: d.dmg, cdLeft: 0 }; }
      function mkFoe(type, pos) { var d = FOE_DEFS[type]; return { id: uid++, type: type, glyph: d.glyph, name: d.name, hp: d.hp, pos: pos, intent: null, cool: 0 }; }

      function spawnWave() {
        var list = WAVES[S.stage][S.wave];
        var edges = [0, W - 1, 1, W - 2, 2];
        S.foes = [];
        for (var i = 0; i < list.length; i++) {
          var pos = edges[i % edges.length];
          if (pos === S.p.pos) pos = pos < W / 2 ? pos + 1 : pos - 1;
          S.foes.push(mkFoe(list[i], pos));
        }
        S.log = 'STAGE ' + (S.stage + 1) + ' — ' + (S.wave + 1) + '번째 대치. 적 ' + S.foes.length + '명.';
      }

      var foeAt = function (pos) { return S.foes.find(function (f) { return f.pos === pos && f.hp > 0; }) || null; };
      var inBoard = function (pos) { return pos >= 0 && pos < W; };

      /* ---- 기술 집행 (오리지널 효과) ---- */
      function hitFoe(f, dmg, why) {
        f.hp -= dmg;
        if (f.hp <= 0) { S.kills++; S.log = why + ' — ' + f.name + ' 격파!'; }
        else S.log = why + ' — ' + f.name + ' ' + f.hp + 'HP 남음';
      }
      function execTile(t) {
        var p = S.p, d = p.dir, tgt;
        if (t.key === 'seg' || t.key === 'bal') {
          tgt = foeAt(p.pos + d); if (tgt) hitFoe(tgt, t.dmg, t.name);
        } else if (t.key === 'jji') {
          tgt = foeAt(p.pos + 2 * d); if (tgt) hitFoe(tgt, t.dmg, t.name);
        } else if (t.key === 'hoe') {
          [foeAt(p.pos + 1), foeAt(p.pos - 1)].forEach(function (f) { if (f) hitFoe(f, t.dmg, t.name); });
        } else if (t.key === 'su') {
          for (var q = p.pos + d; inBoard(q); q += d) { var f2 = foeAt(q); if (f2) { hitFoe(f2, t.dmg, t.name); break; } }
        } else if (t.key === 'mil') {
          tgt = foeAt(p.pos + d);
          if (tgt) {
            if (t.dmg > 0) hitFoe(tgt, t.dmg, t.name);
            if (tgt.hp > 0) {
              var to = tgt.pos, moved = 0;
              while (moved < 2 && inBoard(to + d) && !foeAt(to + d) && to + d !== p.pos) { to += d; moved++; }
              tgt.pos = to;
              if (moved < 2) hitFoe(tgt, 1, '밀치기 충돌');
              else S.log = '밀치기 — ' + tgt.name + ' 넉백';
            }
          }
        } else if (t.key === 'dol') {
          var np = p.pos, steps = 0;
          while (steps < 2 && inBoard(np + d) && !foeAt(np + d)) { np += d; steps++; }
          p.pos = np;
          tgt = foeAt(p.pos + d); if (tgt) hitFoe(tgt, t.dmg, '돌진'); else if (steps) S.log = '돌진 — ' + steps + '칸 전진';
        }
        t.cdLeft = t.cd;
      }

      /* ---- 적 차례: ① 예고된 공격 집행 → ② 이동/새 예고 ---- */
      function foeTelegraphCells(f) {
        var d = FOE_DEFS[f.type];
        var dir = S.p.pos > f.pos ? 1 : S.p.pos < f.pos ? -1 : (f.pos < W / 2 ? 1 : -1);
        if (d.both) return [f.pos + 1, f.pos - 1].filter(inBoard);
        return d.rng.map(function (r) { return f.pos + dir * r; }).filter(inBoard);
      }
      function foePhase() {
        var i, f;
        /* ① 집행 */
        for (i = 0; i < S.foes.length; i++) {
          f = S.foes[i];
          if (f.hp <= 0 || !f.intent) continue;
          if (f.intent.cells.indexOf(S.p.pos) >= 0) {
            S.p.hp -= 1;
            S.log = f.name + '의 일격! 체력 -1';
            if (S.p.hp <= 0) { S.over = true; saveBest(); return; }
          }
          f.intent = null;
          f.cool = 1; /* 집행 후 1턴 숨 고르기 */
        }
        /* ② 이동 또는 예고 */
        for (i = 0; i < S.foes.length; i++) {
          f = S.foes[i];
          if (f.hp <= 0) continue;
          if (f.cool > 0) { f.cool--; continue; }
          var d = FOE_DEFS[f.type];
          var dist = Math.abs(S.p.pos - f.pos);
          var canHit = d.both ? dist === 1 : d.rng.indexOf(dist) >= 0;
          if (f.type === 'daimyo') { bossAct(f); continue; }
          if (canHit) f.intent = { cells: foeTelegraphCells(f) };
          else {
            var dir = S.p.pos > f.pos ? 1 : -1;
            var steps = d.spd;
            while (steps-- > 0) {
              var want = Math.abs(S.p.pos - (f.pos + dir));
              var tooClose = d.rng[0] > 1 && want < d.rng[0]; /* 원거리형은 최소 사거리 유지 */
              if (tooClose) { dir = -dir; }
              var np = f.pos + dir;
              if (inBoard(np) && np !== S.p.pos && !foeAt(np)) f.pos = np;
            }
            var dist2 = Math.abs(S.p.pos - f.pos);
            if (d.both ? dist2 === 1 : d.rng.indexOf(dist2) >= 0) f.intent = { cells: foeTelegraphCells(f) };
          }
        }
        S.foes = S.foes.filter(function (x) { return x.hp > 0; });
      }
      function bossAct(f) {
        f.phase = (f.phase || 0) % 3;
        var alive = S.foes.filter(function (x) { return x.hp > 0 && x.type !== 'daimyo'; }).length;
        if (f.phase === 0 && alive < 2) {
          var side = f.pos < S.p.pos ? -1 : 1;
          var sp = f.pos + side;
          if (inBoard(sp) && !foeAt(sp) && sp !== S.p.pos) { S.foes.push(mkFoe('ronin', sp)); S.log = '다이묘가 낭인을 불러낸다!'; }
        } else if (f.phase === 1) {
          f.intent = { cells: foeTelegraphCells(f) };
        } else {
          var dir = S.p.pos > f.pos ? 1 : -1;
          var np = f.pos + dir;
          if (inBoard(np) && np !== S.p.pos && !foeAt(np)) f.pos = np;
          var dist = Math.abs(S.p.pos - f.pos);
          if (FOE_DEFS.daimyo.rng.indexOf(dist) >= 0) f.intent = { cells: foeTelegraphCells(f) };
        }
        f.phase++;
      }

      /* ---- 웨이브/보상/진행 ---- */
      function afterAction() {
        if (S.over) { render(); return; }
        if (!S.foes.some(function (f) { return f.hp > 0; })) {
          if (S.stage === WAVES.length - 1 && S.wave === WAVES[S.stage].length - 1) { S.won = true; saveBest(); render(); return; }
          S.reward = rollRewards();
          render(); return;
        }
        foePhase();
        S.turn++;
        tickCooldowns();
        render();
      }
      function tickCooldowns() { S.tiles.forEach(function (t) { if (t.cdLeft > 0) t.cdLeft--; }); }
      function rollRewards() {
        var opts = [];
        var unowned = Object.keys(TILE_DEFS).filter(function (k) { return !S.tiles.some(function (t) { return t.key === k; }); });
        if (unowned.length && S.tiles.length < 6) { var k = unowned[(Math.random() * unowned.length) | 0]; opts.push({ kind: 'new', key: k, label: '새 기술패: ' + TILE_DEFS[k].name, desc: TILE_DEFS[k].info(TILE_DEFS[k]) }); }
        var up = S.tiles[(Math.random() * S.tiles.length) | 0];
        opts.push({ kind: 'dmg', key: up.key, label: up.name + ' 강화', desc: '피해 +1 (현재 ' + up.dmg + ')' });
        var cdT = S.tiles.filter(function (t) { return t.cd > 1; });
        if (cdT.length) { var c = cdT[(Math.random() * cdT.length) | 0]; opts.push({ kind: 'cd', key: c.key, label: c.name + ' 단련', desc: '쿨다운 -1 (현재 ' + c.cd + '턴)' }); }
        opts.push({ kind: 'hp', label: '요양', desc: '최대 체력 +1 · 전체 회복' });
        return opts.slice(0, 3);
      }
      function pickReward(i) {
        var o = S.reward[i];
        if (o.kind === 'new') S.tiles.push(mkTile(o.key));
        else if (o.kind === 'dmg') S.tiles.forEach(function (t) { if (t.key === o.key) t.dmg++; });
        else if (o.kind === 'cd') S.tiles.forEach(function (t) { if (t.key === o.key) t.cd = Math.max(1, t.cd - 1); });
        else if (o.kind === 'hp') { S.p.maxHp++; S.p.hp = S.p.maxHp; }
        S.reward = null;
        S.wave++;
        if (S.wave >= WAVES[S.stage].length) { S.stage++; S.wave = 0; }
        S.queue = [];
        S.tiles.forEach(function (t) { t.cdLeft = 0; });
        spawnWave();
        render();
      }

      /* ---- 플레이어 행동 (모두 1턴) ---- */
      function act(type, arg) {
        if (!S || S.screen !== 'play' || S.over || S.won || S.reward) return;
        var p = S.p;
        if (type === 'move') {
          var np = p.pos + arg;
          if (!inBoard(np) || foeAt(np)) { S.log = '길이 막혀 있다.'; render(); return; }
          p.pos = np;
        } else if (type === 'flip') { p.dir = -p.dir; S.log = '방향 전환.'; }
        else if (type === 'wait') { S.log = '호흡을 고른다.'; }
        else if (type === 'queue') {
          var t = S.tiles[arg];
          if (!t || t.cdLeft > 0 || S.queue.length >= QMAX || S.queue.indexOf(arg) >= 0) return;
          S.queue.push(arg); S.log = t.name + ' 준비 (' + S.queue.length + '/' + QMAX + ')';
        } else if (type === 'strike') {
          if (!S.queue.length) return;
          var names = [];
          S.queue.forEach(function (idx) { var tl = S.tiles[idx]; names.push(tl.name); execTile(tl); if (S.over) return; });
          S.queue = [];
          S.log = '발동! ' + names.join(' → ') + (S.log ? ' · ' + S.log : '');
        } else return;
        afterAction();
      }
      function score() { return S.kills * 10 + (S.stage * 3 + S.wave) * 25 + (S.won ? 300 : 0); }
      function saveBest() { try { var b = +localStorage.getItem('st2:best') || 0; if (score() > b) localStorage.setItem('st2:best', String(score())); } catch (e) {} }
      function best() { try { return +localStorage.getItem('st2:best') || 0; } catch (e) { return 0; } }

      /* ---- 렌더 ---- */
      var $g = document.getElementById('game');
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      function render() {
        if (!S || S.screen === 'title') { $g.innerHTML = titleHtml(); wire(); return; }
        if (S.over || S.won) { $g.innerHTML = endHtml(); wire(); return; }
        if (S.reward) { $g.innerHTML = rewardHtml(); wire(); return; }
        var teleCells = {};
        S.foes.forEach(function (f) { if (f.intent) f.intent.cells.forEach(function (c) { teleCells[c] = 1; }); });
        var cells = '';
        for (var i = 0; i < W; i++) {
          var inner = '';
          if (S.p.pos === i) inner = '<span class="unit pl">侍<span class="face ' + (S.p.dir > 0 ? 'R' : 'L') + '">' + (S.p.dir > 0 ? '▶' : '◀') + '</span></span>';
          else { var f = foeAt(i); if (f) inner = '<span class="unit ' + (FOE_DEFS[f.type].boss ? 'boss' : 'en') + '">' + f.glyph + '<span class="uhp">' + '●'.repeat(f.hp) + '</span></span>'; }
          cells += '<div class="cell' + (teleCells[i] ? ' tele' : '') + '">' + inner + '</div>';
        }
        var idx = ''; for (var j = 0; j < W; j++) idx += '<span>' + (j + 1) + '</span>';
        var intents = S.foes.filter(function (f) { return f.intent; }).map(function (f) { return f.name + ' → <b>' + f.intent.cells.map(function (c) { return c + 1; }).join('·') + '칸</b>'; });
        var qs = '';
        for (var q = 0; q < QMAX; q++) {
          var ti = S.queue[q] != null ? S.tiles[S.queue[q]] : null;
          qs += '<div class="q-slot' + (ti ? ' full' : '') + '">' + (ti ? ti.glyph : '') + '</div>';
        }
        var tiles = S.tiles.map(function (t, i2) {
          var qd = S.queue.indexOf(i2) >= 0;
          return '<button class="tile" data-q="' + i2 + '" ' + (t.cdLeft > 0 || qd || S.queue.length >= QMAX ? 'disabled' : '') + '>' +
            (t.cdLeft > 0 ? '<span class="t-cd">' + t.cdLeft + '</span>' : '') +
            '<div class="t-name">' + t.glyph + ' ' + esc(t.name) + '</div>' +
            '<div class="t-info">' + TILE_DEFS[t.key].info(t) + ' · 쿨 ' + t.cd + '턴</div></button>';
        }).join('');
        $g.innerHTML =
          '<div class="hud"><span class="hp">' + '♥'.repeat(S.p.hp) + '<span style="opacity:.25">' + '♥'.repeat(Math.max(0, S.p.maxHp - S.p.hp)) + '</span></span>' +
          '<span class="st">STAGE ' + (S.stage + 1) + '/3 · WAVE ' + (S.wave + 1) + ' · TURN ' + S.turn + '</span>' +
          '<span class="score">SCORE ' + score() + '</span></div>' +
          '<div class="lane">' + cells + '</div><div class="lane-idx">' + idx + '</div>' +
          '<div class="intent">' + (intents.length ? '⚠ 예고: ' + intents.join(' · ') : '적이 다음 수를 노린다…') + '</div>' +
          '<div class="log">» ' + S.log + '</div>' +
          '<div class="queue"><span class="q-label">COMBO</span>' + qs + '<button class="btn-strike" id="strike" ' + (S.queue.length ? '' : 'disabled') + '>발동!</button></div>' +
          '<div class="tiles">' + tiles + '</div>' +
          '<div class="moves"><button class="mbtn" data-a="left">◀ 이동</button><button class="mbtn" data-a="flip">⇄ 전환</button><button class="mbtn" data-a="wait">◦ 대기</button><button class="mbtn" data-a="right">이동 ▶</button></div>' +
          '<div class="keys">키보드: ←→ 이동 · ↑ 전환 · 1~6 기술패 · Space 발동 · W 대기</div>';
        wire();
      }
      function titleHtml() {
        return '<div class="screen"><h1>사무라이 택틱스 <span class="two">2</span></h1>' +
          '<div class="sub">한 줄 전장 · 큐 콤보 · 예고를 읽는 검술 두뇌전</div>' +
          '<div class="stat">BEST SCORE ' + best() + '</div>' +
          '<button class="big-btn" id="start">입문 (시작)</button>' +
          '<div class="howto"><b>규칙.</b> 모든 행동은 1턴이고, 그때마다 적도 움직인다.<br />' +
          '적은 공격 전에 <b>⚠로 예고</b>한다 — 예고된 칸을 피하거나, 그 전에 베어라.<br />' +
          '기술패를 <b>콤보 큐(최대 3)</b>에 쌓고 <b>발동</b>하면 한 호흡에 집행된다. 사용한 패는 쿨다운.<br />' +
          '기술은 <b>바라보는 방향(▶/◀)</b>으로 나간다. 등 뒤는 <b>⇄ 전환</b>으로 지켜라.<br />' +
          '웨이브를 이기면 보상 — 새 기술·강화·회복. 3스테이지 끝의 <b>다이묘</b>를 베면 승리.</div></div>';
      }
      function rewardHtml() {
        return '<div class="screen"><h1 style="font-size:22px">승리의 대가</h1><div class="sub">하나를 고르시오</div><div class="reward-opts">' +
          S.reward.map(function (o, i) { return '<button class="tile" data-r="' + i + '"><div class="t-name">' + esc(o.label) + '</div><div class="t-info">' + esc(o.desc) + '</div></button>'; }).join('') +
          '</div></div>';
      }
      function endHtml() {
        return '<div class="screen"><h1 style="font-size:26px">' + (S.won ? '천하통일' : '낙명(落命)') + '</h1>' +
          '<div class="sub">' + (S.won ? '다이묘를 베었다. 그대의 검이 시대를 갈랐다.' : 'STAGE ' + (S.stage + 1) + '에서 쓰러졌다. 검은 다시 잡는 자의 것.') + '</div>' +
          '<div class="stat">SCORE ' + score() + ' · BEST ' + best() + ' · 격파 ' + S.kills + '</div>' +
          '<button class="big-btn" id="start">' + (S.won ? '한 번 더' : '재도전') + '</button></div>';
      }
      function wire() {
        var st = document.getElementById('start'); if (st) st.onclick = newRun;
        var sk = document.getElementById('strike'); if (sk) sk.onclick = function () { act('strike'); };
        Array.prototype.forEach.call($g.querySelectorAll('[data-a]'), function (b) {
          b.onclick = function () { act(b.dataset.a === 'left' ? 'move' : b.dataset.a === 'right' ? 'move' : b.dataset.a, b.dataset.a === 'left' ? -1 : b.dataset.a === 'right' ? 1 : undefined); };
        });
        Array.prototype.forEach.call($g.querySelectorAll('[data-q]'), function (b) { b.onclick = function () { act('queue', +b.dataset.q); }; });
        Array.prototype.forEach.call($g.querySelectorAll('[data-r]'), function (b) { b.onclick = function () { pickReward(+b.dataset.r); }; });
      }
      document.addEventListener('keydown', function (e) {
        if (!S) return;
        if (e.key === 'ArrowLeft') act('move', -1);
        else if (e.key === 'ArrowRight') act('move', 1);
        else if (e.key === 'ArrowUp') act('flip');
        else if (e.key === ' ') { e.preventDefault(); act('strike'); }
        else if (e.key === 'w' || e.key === 'W') act('wait');
        else if (e.key >= '1' && e.key <= '6') act('queue', +e.key - 1);
      });

      /* 테스트 훅 (스텁 검증용) */
      window.__ST2__ = { newRun: newRun, act: act, pickReward: pickReward, state: function () { return S; } };

      /* 타이틀부터 */
      S = null; render();
    </script>
  </body>
</html>
