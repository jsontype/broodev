<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없습니다 (404) | SHEET</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#05080a" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --neon: #00ff9c; --bg: #05080a; --text: #c8ffe6; --muted: #86ae9f; --line: rgba(0, 255, 156, .18); }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: radial-gradient(1000px 700px at 70% -10%, #0c1a18 0%, var(--bg) 55%) fixed, var(--bg); color: var(--text); font-family: 'JetBrains Mono', ui-monospace, 'Segoe UI', 'Malgun Gothic', 'Yu Gothic', 'Microsoft YaHei', 'Leelawadee UI', sans-serif; }
      main { width: min(100%, 560px); border: 1px solid var(--line); border-radius: 8px; padding: 28px 24px; background: rgba(10, 18, 22, .8); box-shadow: 0 0 40px -22px var(--neon); }
      .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--neon); text-decoration: none; font-weight: 800; letter-spacing: 2px; }
      .brand img { width: 24px; height: 24px; border-radius: 5px; }
      .code { font-size: 54px; font-weight: 800; color: var(--neon); margin: 18px 0 4px; text-shadow: 0 0 18px rgba(0, 255, 156, .4); }
      h1 { font-size: 18px; margin: 0 0 10px; }
      p { color: var(--muted); line-height: 1.7; font-size: 14px; margin: 0 0 20px; }
      .btn { display: inline-flex; padding: 10px 16px; border: 1px solid var(--neon); border-radius: 5px; color: var(--neon); text-decoration: none; font-size: 13px; }
      .btn:hover { background: var(--neon); color: #04110c; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><img src="/favicon.svg" alt="" />SHEET</a>
      <div class="code">404</div>
      <h1 id="h">페이지를 찾을 수 없습니다</h1>
      <p id="p">요청하신 주소에 해당하는 페이지가 없습니다. 엑셀 에디터로 돌아가 작업을 이어 가세요 — 편집하던 내용은 이 브라우저에 자동 저장되어 있습니다.</p>
      <a class="btn" id="b" href="/">엑셀 에디터로 돌아가기</a>
    </main>
    <script>
      (function () {
        var T = {
          en: ['Page not found (404)', 'Page not found', 'There is no page at this address. Head back to the Spreadsheet Editor — your work is saved automatically in this browser.', 'Back to the Spreadsheet Editor'],
          ko: ['페이지를 찾을 수 없습니다 (404)', '페이지를 찾을 수 없습니다', '요청하신 주소에 해당하는 페이지가 없습니다. 엑셀 에디터로 돌아가 작업을 이어 가세요 — 편집하던 내용은 이 브라우저에 자동 저장되어 있습니다.', '엑셀 에디터로 돌아가기'],
          ja: ['ページが見つかりません (404)', 'ページが見つかりません', 'このアドレスのページはありません。表計算エディタに戻って作業を続けてください — 編集内容はこのブラウザに自動保存されています。', '表計算エディタに戻る'],
          zh: ['找不到页面 (404)', '找不到页面', '此地址没有对应的页面。返回电子表格编辑器继续工作吧 — 你编辑的内容已自动保存在此浏览器中。', '返回电子表格编辑器'],
          'zh-Hant': ['找不到頁面 (404)', '找不到頁面', '此網址沒有對應的頁面。返回試算表編輯器繼續工作吧 — 你編輯的內容已自動儲存在此瀏覽器中。', '返回試算表編輯器'],
          th: ['ไม่พบหน้า (404)', 'ไม่พบหน้า', 'ไม่มีหน้าที่อยู่นี้ กลับไปที่โปรแกรมแก้ไขสเปรดชีตเพื่อทำงานต่อ — งานของคุณถูกบันทึกอัตโนมัติในเบราว์เซอร์นี้แล้ว', 'กลับไปที่โปรแกรมแก้ไขสเปรดชีต'],
          es: ['Página no encontrada (404)', 'Página no encontrada', 'No hay ninguna página en esta dirección. Vuelve al editor de hojas de cálculo: tu trabajo se guarda automáticamente en este navegador.', 'Volver al editor de hojas'],
          fr: ['Page introuvable (404)', 'Page introuvable', 'Aucune page à cette adresse. Retournez à l’éditeur de tableur : votre travail est enregistré automatiquement dans ce navigateur.', 'Retour à l’éditeur de tableur'],
          de: ['Seite nicht gefunden (404)', 'Seite nicht gefunden', 'Unter dieser Adresse gibt es keine Seite. Zurück zum Tabelleneditor – deine Arbeit ist automatisch in diesem Browser gespeichert.', 'Zurück zum Tabelleneditor'],
          it: ['Pagina non trovata (404)', 'Pagina non trovata', 'Non esiste una pagina a questo indirizzo. Torna all’editor di fogli di calcolo: il lavoro è salvato automaticamente in questo browser.', 'Torna all’editor di fogli'],
          pt: ['Página não encontrada (404)', 'Página não encontrada', 'Não há página neste endereço. Volte ao editor de planilhas — seu trabalho fica salvo automaticamente neste navegador.', 'Voltar ao editor de planilhas'],
          ru: ['Страница не найдена (404)', 'Страница не найдена', 'По этому адресу страницы нет. Вернитесь в редактор таблиц — ваша работа автоматически сохранена в этом браузере.', 'Вернуться в редактор таблиц'],
          nl: ['Pagina niet gevonden (404)', 'Pagina niet gevonden', 'Op dit adres staat geen pagina. Ga terug naar de spreadsheet-editor — je werk is automatisch in deze browser opgeslagen.', 'Terug naar de spreadsheet-editor']
        };
        var norm = function (c) {
          if (!c) return null; c = String(c); if (T[c]) return c;
          var l = c.toLowerCase();
          if (/^zh[-_](tw|hk|mo|hant)/.test(l) || l === 'zh-hant') return 'zh-Hant';
          if (/^zh/.test(l)) return 'zh';
          l = l.split(/[-_]/)[0]; return T[l] ? l : null;
        };
        var lang = null;
        try { lang = norm(new URLSearchParams(location.search).get('lang')); } catch (e) {}
        if (!lang) try { lang = norm(localStorage.getItem('excel:lang')); } catch (e) {}
        lang = lang || 'ko';   // 기준 언어(정적 <html lang="ko">) — navigator 미사용(packages/seo L1)
        var s = T[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
        document.title = s[0] + ' | SHEET';
        document.getElementById('h').textContent = s[1];
        document.getElementById('p').textContent = s[2];
        var b = document.getElementById('b'); b.textContent = s[3]; b.href = '/?lang=' + encodeURIComponent(lang);
      })();
    </script>
  </body>
</html>
