    <style>
      :root { --bg:#05080a; --panel:#0a1014; --neon:#00ff9c; --text:#c8ffe6; --dim:#8fb3a6; --warn:#ffe14d; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.8; }
      .wrap { max-width:640px; margin:0 auto; padding:48px 20px 96px; }
      a { color:var(--neon); }
      h1 { color:var(--neon); font-size:26px; margin:0 0 6px; }
      p { color:var(--dim); font-size:14px; }
      .muted { color:#5f776e; font-size:12px; }
      .nav { display:flex; align-items:center; flex-wrap:wrap; gap:4px 14px; margin-bottom:28px; font-size:13px; }
      .nav a { text-decoration:none; }
      .nav .sp { flex:1; }
      .lang-pick { font-size:13px; font-family:inherit; color:var(--text); background:#060b0e; border:1px solid #1e3a30; padding:4px 6px; }
      hr { border:0; border-top:1px solid rgba(0,255,156,.18); margin:36px 0; }
      footer { color:#5f776e; font-size:12px; text-align:center; }

      form { background:var(--panel); border:1px solid rgba(0,255,156,.18); padding:22px 18px; margin-top:18px; }
      label { display:block; font-size:13px; color:var(--text); margin:14px 0 5px; }
      label:first-child { margin-top:0; }
      .req { color:var(--warn); }
      input, select, textarea {
        width:100%; padding:10px 11px; font-size:16px; /* 16px — iOS 포커스 줌 방지 */
        font-family:inherit; color:var(--text); background:#060b0e;
        border:1px solid #1e3a30; outline:none;
      }
      input:focus, select:focus, textarea:focus { border-color:var(--neon); }
      textarea { min-height:160px; resize:vertical; }
      button[type="submit"] {
        margin-top:20px; width:100%; padding:13px; font-size:15px; font-weight:700; font-family:inherit;
        color:#04140d; background:var(--neon); border:0; cursor:pointer; touch-action:manipulation;
      }
      button[type="submit"]:disabled { opacity:.5; cursor:default; }
      .status { margin-top:14px; font-size:13px; min-height:1.4em; }
      .status.ok { color:var(--neon); }
      .status.err { color:#ff8080; }

      .shot-hint { margin:6px 0 0; font-size:12px; color:var(--dim); }
      .shot-btn {
        margin-top:8px; padding:9px 14px; font-size:13px; font-family:inherit;
        color:var(--text); background:#060b0e; border:1px dashed #1e3a30; cursor:pointer; touch-action:manipulation;
      }
      .shot-btn:hover { border-color:var(--neon); color:var(--neon); }
      .shots { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
      .shot { position:relative; width:84px; height:84px; border:1px solid #1e3a30; }
      .shot img { width:100%; height:100%; object-fit:cover; display:block; }
      .shot .del {
        position:absolute; top:-8px; right:-8px; width:22px; height:22px; line-height:20px; text-align:center;
        font-size:13px; color:#fff; background:#cc2222; border:1px solid #881111; border-radius:50%; cursor:pointer; padding:0;
      }
    </style>

      <h1 id="c-h1">📮 문의 &amp; 버그 신고</h1>
      <p id="c-intro">이용 중 발견한 버그, 개선 제안, 기타 문의를 남겨주세요. 내용은 운영자 메일로 바로 전달됩니다.</p>
      <p class="muted" id="c-note">회신이 필요하면 이메일 주소를 함께 남겨주세요. 남긴 내용 외에 어떤 정보도 수집하지 않습니다.</p>

        <label for="f-kind" id="l-kind">구분</label>

          <option value="개선 제안" id="o-idea">💡 개선 제안</option>
          <option value="일반 문의" id="o-etc">💬 일반 문의</option>
        </select>

        <label for="f-name" id="l-name">이름 / 닉네임</label>
        <input id="f-name" name="name" type="text" maxlength="50" />

        <label for="f-email" id="l-email">회신 받을 이메일</label>
        <input id="f-email" name="email" type="email" maxlength="100" />

        <label for="f-msg" id="l-msg">내용 <span class="req">*</span></label>
        <textarea id="f-msg" name="message" required maxlength="3000"></textarea>
        <p class="shot-hint" id="c-shot-hint"></p>
        <button type="button" class="shot-btn" id="f-shot-btn">🖼 스크린샷 첨부</button>
        <input id="f-shot-file" type="file" accept="image/*" multiple style="display:none" />
        <div class="shots" id="f-shots"></div>

        <button type="submit" id="f-send">보내기</button>
        <p class="status" id="f-status"></p>
      </form>

      <hr />
      <footer>© 2026 broodev · 운영 Y-Systems · <a href="https://broodev.com/">broodev.com</a></footer>

      function detectLang() {
        var q = qs.get('lang');
        if (q && C[q]) return q;
        try {
          var cands = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < cands.length; i++) {
            var lc = String(cands[i] || '').toLowerCase(), base = lc.split('-')[0];
            if (base === 'zh') return /hant|tw|hk|mo/.test(lc) ? 'zh-Hant' : 'zh';
            if (C[base]) return base;
          }
        } catch (e) {}
        return 'en';
      }

      var LANG = detectLang();
      var t = C[LANG];

      var langSel = document.getElementById('n-lang');
      LANGS.forEach(function (l) {
        var o = document.createElement('option');
        o.value = l[0]; o.textContent = l[1];
        langSel.appendChild(o);
      });
      langSel.value = LANG;
      langSel.addEventListener('change', function () { applyLang(langSel.value); });

      function applyLang(code) {
        LANG = code; t = C[code];
        document.documentElement.lang = code;
        document.title = t.doc;
        var back = document.getElementById('n-back');
        back.textContent = t.back;
        back.href = APPS[APP];
        document.getElementById('n-privacy').textContent = t.privacy;
        document.getElementById('n-terms').textContent = t.terms;
        document.getElementById('c-h1').textContent = t.h1;
        document.getElementById('c-intro').textContent = t.intro;
        document.getElementById('c-note').textContent = t.note;
        document.getElementById('l-kind').textContent = t.kind;
        document.getElementById('o-bug').textContent = t.bug;
        document.getElementById('o-idea').textContent = t.idea;
        document.getElementById('o-etc').textContent = t.etc;
        document.getElementById('l-name').textContent = t.name;
        document.getElementById('f-name').placeholder = t.namePh;
        document.getElementById('l-email').textContent = t.email;
        document.getElementById('f-email').placeholder = t.emailPh;
        document.getElementById('l-msg').innerHTML = '';
        document.getElementById('l-msg').append(t.msg + ' ');
        var star = document.createElement('span'); star.className = 'req'; star.textContent = '*';
        document.getElementById('l-msg').appendChild(star);
        document.getElementById('f-msg').placeholder = t.msgPh;
        document.getElementById('c-shot-hint').textContent = t.shotHint;
        document.getElementById('f-shot-btn').textContent = t.shotBtn;
        document.getElementById('f-send').textContent = t.send;
      }
      applyLang(LANG);

      var configured = EMAILJS_PUBLIC_KEY && EMAILJS_SERVICE_ID && EMAILJS_TEMPLATE_ID && window.emailjs;
      if (configured) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

      var form = document.getElementById('contact-form');
      var btn = document.getElementById('f-send');
      /* ⚠ 'status'는 window.status(문자열 전용 전역)와 충돌 — DOM 할당이 무시되므로 다른 이름 필수 */
      var statusEl = document.getElementById('f-status');

      /* ── 스크린샷 첨부 (붙여넣기 + 파일 선택) ──────────────────
         EmailJS 무료 플랜은 첨부 미지원이고 Gmail은 본문 base64 이미지를
         제거하므로, 이미지는 /api/shot(Pages Function + KV)에 올리고
         메일에는 https 링크만 담는다. 템플릿 본문에 {{shots}} 필요. */
      var MAX_SHOTS = 3;
      var shots = []; // { url, thumb }
      var shotsBox = document.getElementById('f-shots');
      var shotBtn = document.getElementById('f-shot-btn');
      var shotFile = document.getElementById('f-shot-file');

      function renderShots() {
        shotsBox.innerHTML = '';
        shots.forEach(function (s, i) {
          var d = document.createElement('div');
          d.className = 'shot';
          var img = document.createElement('img');
          img.src = s.thumb;
          img.alt = t.shotAlt + ' ' + (i + 1);
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'del';
          del.textContent = '×';
          del.setAttribute('aria-label', t.shotDel);
          del.onclick = function () { shots.splice(i, 1); renderShots(); };
          d.appendChild(img); d.appendChild(del);
          shotsBox.appendChild(d);
        });
        shotBtn.style.display = shots.length >= MAX_SHOTS ? 'none' : '';
      }

      /* 과도한 원본 업로드 방지: 최대 1600px·JPEG 0.85로 축소 (썸네일은 별도 160px) */
      function shrink(img, maxW, q) {
        var scale = Math.min(1, maxW / img.width);
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        return c;
      }

      function uploadShot(file) {
        if (shots.length >= MAX_SHOTS) return;
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          var thumb = shrink(img, 160, .6).toDataURL('image/jpeg', .6);
          shrink(img, 1600, .85).toBlob(function (blob) {
            if (!blob) return;
            statusEl.className = 'status';
            statusEl.textContent = t.uploading;
            fetch('/api/shot', { method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: blob })
              .then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (j) {
                  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
                  return j;
                });
              })
              .then(function (j) {
                if (shots.length >= MAX_SHOTS) return;
                shots.push({ url: j.url, thumb: thumb });
                renderShots();
                statusEl.textContent = '';
              })
              .catch(function (err) {
                statusEl.className = 'status err';
                statusEl.textContent = t.uploadFail + (err && err.message ? ' [' + err.message + ']' : '');
              });
          }, 'image/jpeg', .85);
        };
        img.onerror = function () { URL.revokeObjectURL(url); };
        img.src = url;
      }

      function addShotFiles(files) {
        Array.prototype.slice.call(files).forEach(function (f) {
          if (f && /^image\//.test(f.type)) uploadShot(f);
        });
      }

      shotBtn.addEventListener('click', function () { shotFile.click(); });
      shotFile.addEventListener('change', function () { addShotFiles(shotFile.files); shotFile.value = ''; });
      document.addEventListener('paste', function (e) {
        if (!e.clipboardData) return;
        var imgs = Array.prototype.filter.call(e.clipboardData.items, function (it) { return /^image\//.test(it.type); });
        if (!imgs.length) return;
        e.preventDefault();
        addShotFiles(imgs.map(function (it) { return it.getAsFile(); }));
      });
      /* ───────────────────────────────────────────────────────── */

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var kind = document.getElementById('f-kind').value; // 한국어 고정값 — 운영자 메일용
        var name = document.getElementById('f-name').value.trim();
        var email = document.getElementById('f-email').value.trim();
        var message = document.getElementById('f-msg').value.trim();
        if (!message) return;
        var kindTag = '[' + APP + '] ' + kind;
        /* 메일 제목: 카테고리별 아이콘 + "OO앱에서 OO이 들어왔습니다" — 템플릿 Subject는 {{subject}} 하나만 사용 */
        var SUBJ = {
          '버그 신고': ['🚨 버그 신고', '버그 신고가'],
          '개선 제안': ['💡 개선 제안', '개선 제안이'],
          '일반 문의': ['💬 문의', '문의가'],
        }[kind];
        var subject = '[' + SUBJ[0] + '] broodev-' + APP + '에서 ' + SUBJ[1] + ' 들어왔습니다.';

        if (!configured) {
          /* 키 미설정 시 폴백: 메일 앱을 열어 내용을 채워줌 */
          var body = '[' + kindTag + ']' + (name ? ' from ' + name : '') + (email ? ' <' + email + '>' : '') + '\n\n' + message +
            (shots.length ? '\n\n' + shots.map(function (s, i) { return t.shotWord + ' ' + (i + 1) + ': ' + s.url; }).join('\n') : '');
          location.href = 'mailto:' + FALLBACK_MAIL +
            '?subject=' + encodeURIComponent(subject) +
            '&body=' + encodeURIComponent(body);
          return;
        }

        btn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = t.sending;
        var shotLinks = shots.length
          ? shots.map(function (s, i) { return '스크린샷 ' + (i + 1) + ': ' + s.url; }).join('\n')
          : t.noShot;
        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          subject: subject, kind: kindTag, name: name || '(무기명)', email: email || '(회신 주소 없음)', message: message,
          page: location.href, ua: navigator.userAgent,
          shots: shotLinks,
        }).then(function () {
          statusEl.className = 'status ok';
          statusEl.textContent = t.sent;
          form.reset();
          shots = [];
          renderShots();
          btn.disabled = false;
        }).catch(function () {
          statusEl.className = 'status err';
          statusEl.textContent = t.sendFail + FALLBACK_MAIL;
          btn.disabled = false;
        });
      });
    </script>
