<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Bangla Panel</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #06150e; --panel: #0d281c; --line: #1e4a35; --accent: #f42a41; --text: #eaf6ee; --dim: #9dc4ab;
        --font: 'Consolas', 'Menlo', ui-monospace, monospace;
        --ui: 'Segoe UI', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); line-height: 1.6; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 14px 16px 80px; }
      .brand { display: inline-block; padding: 4px 2px 12px; font-family: var(--font); font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: .5px; text-decoration: none; }
      .brand small { color: var(--dim); font-weight: 400; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px; margin-top: 8px; }
      .code { font-family: var(--font); font-size: 13px; color: var(--dim); letter-spacing: 1px; }
      h1 { margin: 4px 0 8px; font-size: 22px; font-family: var(--font); color: var(--accent); }
      p { margin: 0 0 14px; color: var(--dim); font-size: 14px; }
      .links a { display: inline-block; margin: 0 10px 8px 0; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); text-decoration: none; font-size: 14px; }
      .links a:hover { border-color: var(--accent); }
      footer { margin-top: 26px; color: var(--dim); font-size: 12px; text-align: center; }
      footer a { color: var(--dim); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="brand" href="/">▎BANGLA PANEL <small>· pani · bidyut · taka · results</small></a>
      <main class="card">
        <div class="code">ERROR 404</div>
        <h1>Page not found</h1>
        <p>There is nothing at this address. Bangla Panel is a single-page panel — everything is on the home page.</p>
        <div class="links">
          <a href="/">← Back to Bangla Panel</a>
          <a href="https://broodev.com/">All broodev apps</a>
        </div>
      </main>
      <footer>© 2026 broodev · Y-Systems · <a href="mailto:support@broodev.com">support@broodev.com</a></footer>
    </div>
  </body>
</html>
