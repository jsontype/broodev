      /* ================= 상태 ================= */
      var store = {
        get: function (k, d) { try { var r = localStorage.getItem(k); return r != null ? JSON.parse(r) : d; } catch (e) { return d; } },
        set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
      };
      /* 첫 방문: 브라우저 언어 자동감지 — 덴마크어권(da/kl/fo)=da, 그 외=en (관광객 대응) */
      var lang = store.get('gl:lang', null);
      if (!lang) { var bl = String((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase(); lang = /^(da|kl|fo)/.test(bl) ? 'da' : 'en'; }
      if (!I[lang]) lang = 'da';
      var townId = store.get('gl:town', 'nuuk');
      var destId = store.get('gl:dest', null);
      var tab = store.get('gl:tab', 'sila');
      var cache = {}; // townId → { fc, marine, at }
      var kpCache = null; // { rows, at }

      var $ = function (id) { return document.getElementById(id); };
      var t = function () { return I[lang]; };
      var town = function () { return TOWNS.find(function (x) { return x.id === townId; }) || TOWNS[0]; };
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

      /* ================= 데이터 페치 (Open-Meteo, 키 불필요·CORS OK, 30분 캐시) ================= */
      function fetchJSON(url) {
        return fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
      }
      function loadTown(tw) {
        var c = cache[tw.id];
        if (c && Date.now() - c.at < 30 * 60 * 1000) return Promise.resolve(c);
        var fcUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + tw.lat + '&longitude=' + tw.lon +
          '&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m,snowfall,visibility,cloud_cover' +
          '&daily=sunrise,sunset,daylight_duration,temperature_2m_max,temperature_2m_min,wind_gusts_10m_max,snowfall_sum' +
          '&timezone=auto&forecast_days=7';
        var mUrl = tw.mlat == null ? null :
          'https://marine-api.open-meteo.com/v1/marine?latitude=' + tw.mlat + '&longitude=' + tw.mlon +
          '&hourly=wave_height,sea_level_height_msl&timezone=auto&forecast_days=3';
        return Promise.all([
          fetchJSON(fcUrl),
          mUrl ? fetchJSON(mUrl).catch(function () { return null; }) : Promise.resolve(null),
        ]).then(function (res) {
          var entry = { fc: res[0], marine: res[1], at: Date.now() };
          cache[tw.id] = entry;
          return entry;
        });
      }

      /* 오로라 Kp — NOAA SWPC 3일 예보 (CORS 개방, 30분 캐시) */
      function loadKp() {
        if (kpCache && Date.now() - kpCache.at < 30 * 60 * 1000) return Promise.resolve(kpCache.rows);
        return fetchJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json')
          .then(function (rows) { kpCache = { rows: rows, at: Date.now() }; return rows; })
          .catch(function () { return null; });
      }

      /* ================= 공통 헬퍼 ================= */
      function hourIdxNow(times) {
        var now = Date.now();
        for (var i = 0; i < times.length; i++) if (new Date(times[i]).getTime() >= now) return Math.max(0, i - 1);
        return times.length - 1;
      }
      function fmtT(iso) { var d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
      function fmtD(iso) { var d = new Date(iso); return (d.getMonth() + 1) + '/' + d.getDate(); }
      function next24(fc, key) {
        var i0 = hourIdxNow(fc.hourly.time);
        return fc.hourly[key].slice(i0, i0 + 24).filter(function (v) { return v != null; });
      }

      /* ================= 탭 렌더 ================= */
      function cardSila(entry) {
        var fc = entry.fc, L = t();
        var i0 = hourIdxNow(fc.hourly.time);
        var cur = function (k) { return fc.hourly[k][i0]; };
        var visKm = cur('visibility') == null ? '—' : (cur('visibility') / 1000).toFixed(1) + ' km';
        var snow = next24(fc, 'snowfall').reduce(function (a, b) { return a + b; }, 0);
        var html = '<div class="card"><h2>' + L.now + ' — ' + esc(town().name) + '</h2>' +
          '<div class="big">' + Math.round(cur('temperature_2m')) + '°C</div>' +
          '<div class="row" style="margin-top:8px">' +
          '<div class="kv"><div class="k">' + L.wind + '</div><div class="v">' + Math.round(cur('wind_speed_10m')) + ' km/h</div></div>' +
          '<div class="kv"><div class="k">' + L.gust + '</div><div class="v">' + Math.round(cur('wind_gusts_10m')) + ' km/h</div></div>' +
          '<div class="kv"><div class="k">' + L.vis + '</div><div class="v">' + visKm + '</div></div>' +
          '<div class="kv"><div class="k">' + L.snow24 + '</div><div class="v">' + snow.toFixed(1) + ' cm</div></div>' +
          '</div></div>';

        /* 7일 */
        var d = fc.daily;
        html += '<div class="card"><h2>' + L.days7 + '</h2><div class="scroll-x"><table class="days"><tr><th>' + L.day + '</th><th>' + L.temp + '</th><th>' + L.gust + '</th><th>' + L.snow24 + '</th></tr>';
        for (var i = 0; i < d.time.length; i++) {
          html += '<tr><td>' + fmtD(d.time[i]) + '</td><td>' + Math.round(d.temperature_2m_min[i]) + '…' + Math.round(d.temperature_2m_max[i]) + '°C</td>' +
            '<td>' + Math.round(d.wind_gusts_10m_max[i]) + ' km/h</td><td>' + (d.snowfall_sum[i] || 0).toFixed(1) + ' cm</td></tr>';
        }
        html += '</table></div></div>';

        /* 바다 */
        html += '<div class="card"><h2>' + L.waves + ' <span class="kl">· IMAQ</span></h2>';
        if (entry.marine && entry.marine.hourly) {
          var m = entry.marine.hourly, mi = hourIdxNow(m.time);
          var wv = m.wave_height[mi];
          html += '<div class="row"><div class="kv"><div class="k">' + L.waveNow + '</div><div class="v">' + (wv == null ? '—' : wv.toFixed(1) + ' m') + '</div></div>';
          var tides = nextTides(m.time, m.sea_level_height_msl, mi);
          for (var k = 0; k < Math.min(2, tides.length); k++) {
            var td = tides[k];
            html += '<div class="kv"><div class="k">' + (td.type === 'high' ? L.tideHigh : L.tideLow) + '</div><div class="v">' + fmtT(td.t) + ' <span class="muted">(' + td.v.toFixed(1) + ' m)</span></div></div>';
          }
          html += '</div><div class="muted" style="margin:10px 0 4px">' + L.tide48 + '</div><canvas class="spark" id="tide-cv" width="700" height="70"></canvas>';
        } else {
          html += '<div class="muted">' + L.noMarine + '</div>';
        }
        html += '</div>';

        /* 태양 */
        var sunHtml = '';
        var dl = d.daylight_duration[0]; // 초
        var cd = sunChangeCountdown(town().lat, new Date());
        if (cd && cd.state === 'night') sunHtml = '<div class="note">' + L.polarNight + ' ' + L.sunReturn(cd.days) + '</div>';
        else if (cd && cd.state === 'mid') sunHtml = '<div class="note">' + L.midnightSun + ' ' + L.sunLeave(cd.days) + '</div>';
        html += '<div class="card"><h2>' + L.sun + ' <span class="kl">· SEQINEQ</span></h2>' + sunHtml +
          '<div class="row">' +
          '<div class="kv"><div class="k">' + L.sunrise + '</div><div class="v">' + (cd && cd.state === 'night' ? '—' : fmtT(d.sunrise[0])) + '</div></div>' +
          '<div class="kv"><div class="k">' + L.sunset + '</div><div class="v">' + (cd ? '—' : fmtT(d.sunset[0])) + '</div></div>' +
          '<div class="kv"><div class="k">' + L.daylight + '</div><div class="v">' + (dl / 3600).toFixed(1) + ' h</div></div>' +
          '</div></div>';

        /* 오로라 — Kp(NOAA) × 어둠(백야 여부) × 구름 */
        html += '<div class="card" id="aurora-card"><h2>' + L.aurora + ' <span class="kl">· ARSARNERIT</span></h2><div class="loading">' + L.loading + '</div></div>';

        /* 얼음 — 공식 링크만 (자체 판정 금지) */
        html += '<div class="card"><h2>' + L.ice + ' <span class="kl">· SIKU</span></h2><div class="links">' +
          '<a href="https://ocean.dmi.dk/arctic/icecharts.uk.php" target="_blank" rel="noopener">' + L.iceLink + '<span>ocean.dmi.dk</span></a>' +
          '</div><div class="note">' + L.iceNote + '</div></div>';
        return html;
      }

      /* 오로라 카드 채우기 — cardSila 마운트 후 비동기 */
      function fillAurora(entry, rows) {
        var el = $('aurora-card'); if (!el) return;
        var L = t();
        if (!rows) { el.innerHTML = '<h2>' + L.aurora + ' <span class="kl">· ARSARNERIT</span></h2><div class="muted">' + L.fetchErr + '</div>'; return; }
        var now = Date.now();
        var kpNow = null, kpMax = 0;
        rows.forEach(function (r) {
          var ts = new Date(r.time_tag + 'Z').getTime(), kp = +r.kp;
          if (ts <= now) kpNow = kp;
          if (ts > now && ts < now + 24 * 3600e3 && kp > kpMax) kpMax = kp;
        });
        var cd = sunChangeCountdown(town().lat, new Date());
        var cloud = next24(entry.fc, 'cloud_cover');
        var cloudAvg = cloud.length ? Math.round(cloud.reduce(function (a, b) { return a + b; }, 0) / cloud.length) : null;
        var verdict, cls;
        if (cd && cd.state === 'mid') { verdict = L.auroraNoNight; cls = 'muted'; }
        else if (kpMax >= 1.5 && (cloudAvg == null || cloudAvg < 60)) { verdict = L.auroraGood; cls = 'ok'; }
        else if (kpMax >= 1.5) { verdict = L.auroraCloudy; cls = 'warn'; }
        else { verdict = L.auroraQuiet; cls = 'muted'; }
        el.innerHTML = '<h2>' + L.aurora + ' <span class="kl">· ARSARNERIT</span></h2>' +
          '<div class="' + cls + '" style="font-size:14.5px;margin-bottom:8px">' + verdict + '</div>' +
          '<div class="row">' +
          '<div class="kv"><div class="k">' + L.kpNow + '</div><div class="v">' + (kpNow == null ? '—' : kpNow.toFixed(1)) + '</div></div>' +
          '<div class="kv"><div class="k">' + L.kpMax + '</div><div class="v">' + kpMax.toFixed(1) + '</div></div>' +
          '<div class="kv"><div class="k">' + L.cloudTonight + '</div><div class="v">' + (cloudAvg == null ? '—' : cloudAvg + '%') + '</div></div>' +
          '</div><div class="note">' + L.auroraNote + '</div>';
      }

      /* 한 지점의 24h 기상 요약 → 리스크 재료 */
      function riskInput(entry) {
        var fc = entry.fc;
        var gustMax = Math.max.apply(null, next24(fc, 'wind_gusts_10m'));
        var visArr = next24(fc, 'visibility');
        var visMin = visArr.length ? Math.min.apply(null, visArr) : null;
        var snowSum = next24(fc, 'snowfall').reduce(function (a, b) { return a + b; }, 0);
        return { gustMax: gustMax, visMin: visMin, snowSum: snowSum, risk: flightRisk(gustMax, visMin, snowSum) };
      }
      var RISK_ORDER = { LOW: 0, MED: 1, HIGH: 2 };

      function destTown() {
        var d = TOWNS.find(function (x) { return x.id === destId; });
        if (d && d.id !== townId) return d;
        return townId === 'nuuk' ? TOWNS.find(function (x) { return x.id === 'ilulissat'; }) : TOWNS.find(function (x) { return x.id === 'nuuk'; });
      }

      function cardTrans(entryFrom, entryTo) {
        var L = t();
        var a = riskInput(entryFrom), b = riskInput(entryTo);
        var risk = RISK_ORDER[a.risk] >= RISK_ORDER[b.risk] ? a.risk : b.risk;
        var msg = risk === 'HIGH' ? L.riskHigh : risk === 'MED' ? L.riskMed : L.riskLow;
        var leg = function (name, r) {
          return '<div class="muted" style="margin-top:4px"><b style="color:var(--text)">' + esc(name) + '</b> · ' + L.gust + ' max ' + Math.round(r.gustMax) + ' km/h · ' + L.vis + ' min ' + (r.visMin == null ? '—' : (r.visMin / 1000).toFixed(1) + ' km') + ' · ' + L.snow24 + ' ' + r.snowSum.toFixed(1) + ' cm</div>';
        };
        var opts = TOWNS.filter(function (x) { return x.id !== townId; }).map(function (x) {
          return '<option value="' + x.id + '"' + (x.id === destTown().id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
        }).join('');
        var html = '<div class="card"><h2>' + L.riskTitle + '</h2>' +
          '<div class="row" style="margin-bottom:10px;align-items:center">' +
          '<span class="muted">' + L.from + '</span> <b>' + esc(town().name) + '</b>' +
          '<span class="muted">→ ' + L.to + '</span> <select class="sel" id="dest-sel" aria-label="' + L.to + '">' + opts + '</select>' +
          '</div>' +
          '<div class="risk"><div class="risk-dot risk-' + risk + '">' + risk + '</div><div>' + msg +
          leg(town().name, a) + leg(destTown().name, b) + '</div></div>' +
          ((town().piteraq || destTown().piteraq) ? '<div class="note">' + L.piteraq + '</div>' : '') +
          '<div class="note">' + L.routeNote + '</div></div>';

        html += '<div class="card"><h2>' + L.offLinks + '</h2><div class="links">' +
          '<a href="https://www.airgreenland.com/" target="_blank" rel="noopener">' + L.linkAG + '<span>' + L.linkAGd + '</span></a>' +
          '<a href="https://www.royalarcticline.com/" target="_blank" rel="noopener">' + L.linkRAL + '<span>' + L.linkRALd + '</span></a>' +
          '<a href="https://aul.gl/" target="_blank" rel="noopener">' + L.linkAUL + '<span>' + L.linkAULd + '</span></a>' +
          '<a href="https://diskoline.gl/" target="_blank" rel="noopener">' + L.linkDL + '<span>' + L.linkDLd + '</span></a>' +
          '</div></div>';
        return html;
      }

      function cardOqa() {
        var L = t();
        return '<div class="card"><h2>' + L.oqaTitle + ' <span class="kl">· OQAATSIT</span></h2>' +
          '<p style="font-size:13.5px;margin:4px 0 10px">' + L.oqaBody + '</p><div class="links">' +
          '<a href="https://oqaasileriffik.gl/" target="_blank" rel="noopener">' + L.linkOqa + '<span>' + L.linkOqad + '</span></a>' +
          '<a href="https://ordbog.gl/" target="_blank" rel="noopener">' + L.linkOrdbog + '<span>' + L.linkOrdbogd + '</span></a>' +
          '<a href="https://voca.broodev.com/" target="_blank" rel="noopener">' + L.vocaCross + '<span>' + L.vocaCrossd + '</span></a>' +
          '</div></div>';
      }

      function cardHunt() {
        var L = t();
        var html = '<div class="card"><h2>' + L.huntTitle + '</h2><p style="font-size:13.5px;margin:4px 0 10px">' + L.huntBody + '</p><div class="links">' +
          '<a href="https://www.sullissivik.gl/" target="_blank" rel="noopener">' + L.linkSull + '<span>' + L.linkSulld + '</span></a>' +
          '<a href="https://www.naalakkersuisut.gl/" target="_blank" rel="noopener">' + L.linkNaal + '<span>' + L.linkNaald + '</span></a>' +
          '</div></div>';

        var opts = Object.keys(L.sp).map(function (k) { return '<option value="' + k + '">' + L.sp[k] + '</option>'; }).join('');
        html += '<div class="card"><h2>' + L.logTitle + '</h2><div class="note">' + L.logNote + '</div>' +
          '<form class="catch" id="catch-form">' +
          '<input type="date" id="c-date" required value="' + new Date().toISOString().slice(0, 10) + '" />' +
          '<select id="c-sp">' + opts + '</select>' +
          '<input type="number" id="c-n" min="1" value="1" required aria-label="' + L.count + '" />' +
          '<input type="text" id="c-place" placeholder="' + L.place + '" maxlength="60" />' +
          '<button class="btn full" type="submit">+ ' + L.add + '</button>' +
          '</form><ul class="log" id="catch-list"></ul>' +
          '<button class="btn ghost" id="csv-btn" style="margin-top:10px">⭳ ' + L.exportCsv + '</button></div>';
        return html;
      }

      function renderCatchList() {
        var L = t();
        var list = store.get('gl:catches', []);
        var ul = $('catch-list');
        if (!ul) return;
        if (!list.length) { ul.innerHTML = '<li class="muted">' + L.empty + '</li>'; return; }
        ul.innerHTML = list.map(function (c, i) {
          return '<li><span class="d">' + esc(c.date) + '</span><span>' + esc(L.sp[c.sp] || c.sp) + ' × ' + esc(c.n) + (c.place ? ' <span class="muted">· ' + esc(c.place) + '</span>' : '') + '</span><button class="x" data-i="' + i + '">×</button></li>';
        }).join('');
        Array.prototype.forEach.call(ul.querySelectorAll('.x'), function (b) {
          b.onclick = function () { var l = store.get('gl:catches', []); l.splice(+b.dataset.i, 1); store.set('gl:catches', l); renderCatchList(); };
        });
      }

      function drawTide(entry) {
        var cv = $('tide-cv');
        if (!cv || !entry.marine) return;
        var m = entry.marine.hourly, i0 = hourIdxNow(m.time);
        var vals = m.sea_level_height_msl.slice(i0, i0 + 48).filter(function (v) { return v != null; });
        if (vals.length < 4) return;
        var ctx = cv.getContext('2d');
        var W = cv.width, H = cv.height, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        var pad = (max - min) * 0.15 || 0.2; min -= pad; max += pad;
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = 2; ctx.beginPath();
        vals.forEach(function (v, i) {
          var x = (i / (vals.length - 1)) * W, y = H - ((v - min) / (max - min)) * H;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      /* ================= 마운트/이벤트 ================= */
      function render() {
        var L = t();
        document.documentElement.lang = lang;
        $('h-sub').textContent = L.hSub;
        $('tab1-sub').textContent = L.tab1; $('tab2-sub').textContent = L.tab2; $('tab3-sub').textContent = L.tab3; $('tab4-sub').textContent = L.tab4;
        $('f-src').textContent = L.src;
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (el) {
          el.classList.toggle('on', el.dataset.tab === tab);
        });
        var view = $('view');
        if (tab === 'oqa') { view.innerHTML = cardOqa(); return; }
        if (tab === 'hunt') {
          view.innerHTML = cardHunt();
          renderCatchList();
          $('catch-form').onsubmit = function (e) {
            e.preventDefault();
            var l = store.get('gl:catches', []);
            l.unshift({ date: $('c-date').value, sp: $('c-sp').value, n: +$('c-n').value || 1, place: $('c-place').value.trim() });
            store.set('gl:catches', l.slice(0, 500));
            renderCatchList();
          };
          $('csv-btn').onclick = function () {
            var l = store.get('gl:catches', []);
            var csv = 'date,species,count,place\n' + l.map(function (c) { return [c.date, c.sp, c.n, '"' + String(c.place || '').replace(/"/g, '""') + '"'].join(','); }).join('\n');
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = 'fangstlog-' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
          };
          return;
        }
        view.innerHTML = '<div class="loading">' + L.loading + '</div>';
        if (tab === 'sila') {
          loadTown(town()).then(function (entry) {
            view.innerHTML = cardSila(entry);
            drawTide(entry);
            loadKp().then(function (rows) { fillAurora(entry, rows); });
          }).catch(function () {
            view.innerHTML = '<div class="card"><div class="muted">' + L.fetchErr + '</div></div>';
          });
        } else {
          Promise.all([loadTown(town()), loadTown(destTown())]).then(function (r) {
            view.innerHTML = cardTrans(r[0], r[1]);
            var ds = $('dest-sel');
            if (ds) ds.onchange = function () { destId = ds.value; store.set('gl:dest', destId); render(); };
          }).catch(function () {
            view.innerHTML = '<div class="card"><div class="muted">' + L.fetchErr + '</div></div>';
          });
        }
      }

      /* 초기화 */
      (function init() {
        var ts = $('town-sel');
        TOWNS.forEach(function (tw) {
          var o = document.createElement('option'); o.value = tw.id; o.textContent = tw.name; ts.appendChild(o);
        });
        ts.value = town().id;
        ts.onchange = function () { townId = ts.value; store.set('gl:town', townId); render(); };
        var ls = $('lang-sel');
        ls.value = lang;
        ls.onchange = function () { lang = ls.value; store.set('gl:lang', lang); render(); };
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (el) {
          el.onclick = function () { tab = el.dataset.tab; store.set('gl:tab', tab); render(); };
        });
        render();
      })();
    </script>
  </body>
</html>
