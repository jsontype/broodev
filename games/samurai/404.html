<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 | 사무라이 택틱스 2</title>
    <meta name="description" content="요청한 주소에 페이지가 없습니다. 주소를 확인하거나 게임 첫 화면으로 돌아가세요." />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" />
    <!-- Cloudflare Pages: 앱 루트에 404.html 이 있으면 없는 주소를 404 로 응답(소프트 404 방지 · packages/seo/README.md L5).
         없는 주소는 경로가 제각각이라 자산은 모두 루트 절대 경로(/assets/...). 표시 언어 = ?lang > localStorage(st2:lang) > ko (L1). -->
    <style>
      :root { --bg: #12100d; --line: #3a3227; --washi: #e8ddc8; --ink: #d8cfc0; --dim: #8f8474; --red: #c9432f; --gold: #d9a441;
        --font: 'Consolas', 'Menlo', ui-monospace, monospace; --ui: 'Segoe UI', system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -20%, #241f17 0%, var(--bg) 60%); color: var(--ink); font-family: var(--ui);
        display: flex; flex-direction: column; align-items: center; }
      .wrap { width: 100%; max-width: 680px; padding: 14px 16px 40px; }
      .brand { display: inline-block; font-family: var(--font); font-weight: 700; font-size: 16px; color: var(--gold); letter-spacing: 1px; text-decoration: none; padding: 4px 2px 10px; }
      .brand .two { color: var(--red); }
      .screen { border: 1px solid var(--line); background: rgba(20,17,13,.96); border-radius: 12px; padding: 28px 22px 30px; text-align: center; }
      .code { font-family: var(--font); font-size: 44px; font-weight: 700; letter-spacing: 8px; color: var(--red); text-shadow: 0 0 14px rgba(201,67,47,.45); line-height: 1; }
      h1 { margin: 12px 0 6px; font-size: 24px; color: var(--washi); letter-spacing: 2px; }
      p { margin: 0 auto; max-width: 440px; color: var(--dim); font-size: 14px; line-height: 1.7; }
      .lane { display: flex; gap: 5px; margin: 22px 0 18px; padding: 8px 6px 10px; border-radius: 8px; border: 1px solid #0d0a06;
        box-shadow: inset 0 2px 10px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
        background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 11px),
          repeating-linear-gradient(90deg, transparent 0 52px, rgba(0,0,0,.35) 52px 53px, rgba(255,255,255,.02) 53px 55px),
          linear-gradient(180deg, #332514 0%, #291d10 45%, #1e150b 100%); }
      .cell { flex: 1; aspect-ratio: 4/5; min-width: 0; border-radius: 6px; position: relative; display: flex; align-items: flex-end; justify-content: center;
        background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.26)); border: 1px solid rgba(0,0,0,.4); box-shadow: inset 0 -8px 14px rgba(0,0,0,.32); }
      .cell.tele { background: #3a1c15; border-color: var(--red); box-shadow: inset 0 0 12px rgba(201,67,47,.35); }
      .cell.tele::after { content: '⚠'; position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--red); }
      .cell img { width: 190%; max-width: none; height: auto; image-rendering: pixelated; margin-bottom: -4%; filter: drop-shadow(0 3px 4px rgba(0,0,0,.65)); }
      .cell img.flip { transform: scaleX(-1); }
      .btn { display: inline-block; background: var(--red); color: #fff; border-radius: 10px; font-size: 16px; font-weight: 800; padding: 12px 30px; text-decoration: none; }
      .btn:hover, .btn:focus-visible { box-shadow: 0 0 14px rgba(201,67,47,.6); outline: 2px solid var(--gold); outline-offset: 2px; }
      footer { margin-top: 20px; color: #5d5344; font-size: 11px; text-align: center; }
      footer a { color: var(--dim); }
      @media (max-width: 640px) { .code { font-size: 36px; } h1 { font-size: 20px; } .screen { padding: 22px 14px 24px; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="brand" href="/" id="brand">⚔ <span id="brandname">사무라이 택틱스</span> <span class="two">2</span></a>
      <main class="screen">
        <div class="code" aria-hidden="true">404</div>
        <h1 id="t">페이지를 찾을 수 없습니다</h1>
        <p id="d">요청한 주소에 페이지가 없습니다. 주소를 확인하거나 게임 첫 화면으로 돌아가세요.</p>
        <div class="lane" aria-hidden="true">
          <div class="cell"></div><div class="cell"></div><div class="cell"><img src="/assets/hero.png" alt="" /></div>
          <div class="cell tele"></div><div class="cell tele"></div><div class="cell"></div>
          <div class="cell"><img class="flip" src="/assets/foe_ronin_ready.png" alt="" /></div><div class="cell"></div><div class="cell"></div>
        </div>
        <a class="btn" id="home" href="/">게임으로 돌아가기</a>
      </main>
      <footer>© 2026 broodev · Y-Systems · <a href="mailto:support@broodev.com">support@broodev.com</a></footer>
    </div>
    <script>
      (function () {
        'use strict';
        var LANGS = ['ko', 'en', 'ja', 'zh', 'zh-Hant', 'th', 'es', 'fr', 'de', 'it', 'pt', 'ru', 'nl'];
        /* [게임 이름(끝의 2 제외), 제목, 설명, 버튼] — 게임 이름은 index.html I18N 의 title 과 같게 */
        var T = {
          ko: ['사무라이 택틱스', '페이지를 찾을 수 없습니다', '요청한 주소에 페이지가 없습니다. 주소를 확인하거나 게임 첫 화면으로 돌아가세요.', '게임으로 돌아가기'],
          en: ['Samurai Tactics', 'Page not found', "There is no page at this address. Check the URL or go back to the game's title screen.", 'Back to the game'],
          ja: ['サムライタクティクス', 'ページが見つかりません', 'このアドレスにはページがありません。URLを確認するか、ゲームのタイトル画面に戻ってください。', 'ゲームに戻る'],
          zh: ['武士战术', '找不到页面', '此地址没有对应的页面。请检查网址，或返回游戏标题画面。', '返回游戏'],
          'zh-Hant': ['武士戰術', '找不到頁面', '此網址沒有對應的頁面。請檢查網址，或返回遊戲標題畫面。', '返回遊戲'],
          th: ['ซามูไรแทคติกส์', 'ไม่พบหน้านี้', 'ไม่มีหน้าในที่อยู่นี้ ตรวจสอบ URL หรือกลับไปที่หน้าแรกของเกม', 'กลับไปที่เกม'],
          es: ['Samurai Tactics', 'Página no encontrada', 'No hay ninguna página en esta dirección. Revisa la URL o vuelve a la pantalla de inicio del juego.', 'Volver al juego'],
          fr: ['Samurai Tactics', 'Page introuvable', 'Aucune page ne se trouve à cette adresse. Vérifiez l’URL ou revenez à l’écran titre du jeu.', 'Retour au jeu'],
          de: ['Samurai Tactics', 'Seite nicht gefunden', 'Unter dieser Adresse gibt es keine Seite. Prüfe die URL oder kehre zum Titelbildschirm des Spiels zurück.', 'Zurück zum Spiel'],
          it: ['Samurai Tactics', 'Pagina non trovata', "A questo indirizzo non c'è nessuna pagina. Controlla l'URL o torna alla schermata iniziale del gioco.", 'Torna al gioco'],
          pt: ['Samurai Tactics', 'Página não encontrada', 'Não há nenhuma página neste endereço. Confira a URL ou volte para a tela inicial do jogo.', 'Voltar ao jogo'],
          ru: ['Самурай Тактикс', 'Страница не найдена', 'По этому адресу нет страницы. Проверь адрес или вернись на титульный экран игры.', 'Вернуться к игре'],
          nl: ['Samurai Tactics', 'Pagina niet gevonden', 'Op dit adres staat geen pagina. Controleer de URL of ga terug naar het titelscherm van het spel.', 'Terug naar het spel']
        };
        function norm(x) {
          var s = String(x == null ? '' : x).trim().toLowerCase();
          if (!s) return null;
          if (/^zh[-_](tw|hk|mo|hant)/.test(s)) return 'zh-Hant';
          if (s === 'zh' || /^zh[-_](cn|sg|hans)/.test(s)) return 'zh';
          for (var i = 0; i < LANGS.length; i++) if (LANGS[i].toLowerCase() === s) return LANGS[i];
          return null;
        }
        var q = null, sv = null;
        try { q = norm(new URLSearchParams(location.search).get('lang')); } catch (e) {}
        try { sv = norm(localStorage.getItem('st2:lang')); } catch (e) {}
        var lang = q || sv || 'ko';
        if (lang === 'ko') return;
        var m = T[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
        document.title = m[1] + ' | ' + m[0] + ' 2';
        var md = document.querySelector('meta[name="description"]');
        if (md) md.setAttribute('content', m[2]);
        document.getElementById('brandname').textContent = m[0];
        document.getElementById('t').textContent = m[1];
        document.getElementById('d').textContent = m[2];
        var home = document.getElementById('home');
        home.textContent = m[3];
        var to = q ? '/?lang=' + encodeURIComponent(lang) : '/';
        home.setAttribute('href', to);
        document.getElementById('brand').setAttribute('href', to);
      })();
    </script>
    <script src="/lang-suggest.js" data-key="st2:lang" data-base="ko" defer></script>
  </body>
</html>
